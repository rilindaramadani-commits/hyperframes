<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>HydraSkin</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/hydraskin.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #d8c5b2; }
      #main { position: relative; width: 100%; height: 100%; overflow: hidden; background: #d8c5b2; }
      /* the outgoing scene always sits above the incoming one, so seams reveal what comes next */
      #sc-f1 { z-index: 6; }
      #sc-f2 { z-index: 5; }
      #sc-f3 { z-index: 4; }
      #sc-f4 { z-index: 3; }
      #sc-f5 { z-index: 2; }
      #sc-f6 { z-index: 1; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="78" data-width="1080" data-height="1920">
      <!-- Scenes (STORYBOARD.md frames 1–6). Each overlaps the next by its seam; the outgoing scene sits on top. -->
      <div id="sc-f1" class="clip" data-composition-id="f1" data-composition-src="compositions/f1-accroche.html" data-start="0" data-duration="8.4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="sc-f2" class="clip" data-composition-id="f2" data-composition-src="compositions/f2-principe.html" data-start="7.2" data-duration="13.2" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="sc-f3" class="clip" data-composition-id="f3" data-composition-src="compositions/f3-technologie.html" data-start="19.4" data-duration="13.6" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="sc-f4" class="clip" data-composition-id="f4" data-composition-src="compositions/f4-personnalise.html" data-start="31.4" data-duration="15.2" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="sc-f5" class="clip" data-composition-id="f5" data-composition-src="compositions/f5-experience.html" data-start="45.4" data-duration="20.4" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="sc-f6" class="clip" data-composition-id="f6" data-composition-src="compositions/f6-signature.html" data-start="64.4" data-duration="13.6" data-track-index="2" data-width="1080" data-height="1920"></div>

      <!-- Sound: a discreet instrumental bed + two marks only (glass tink on the name, air on the blades).
           Voice-over (SCRIPT.md) goes on its own track once a synthetic voice is available. -->
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="78" data-track-index="10" data-volume="0.55"></audio>
      <audio id="sfx-tink-1" src="assets/audio/sfx-tink.wav" data-start="3.4" data-duration="2.8" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-tink-2" src="assets/audio/sfx-tink.wav" data-start="65.8" data-duration="2.8" data-track-index="11" data-volume="0.4"></audio>
      <audio id="sfx-air-1" src="assets/audio/sfx-air.wav" data-start="7.0" data-duration="1.8" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-air-2" src="assets/audio/sfx-air.wav" data-start="45.2" data-duration="1.8" data-track-index="12" data-volume="0.3"></audio>
      <audio id="sfx-air-3" src="assets/audio/sfx-air.wav" data-start="64.2" data-duration="1.8" data-track-index="12" data-volume="0.3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
