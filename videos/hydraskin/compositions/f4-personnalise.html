      <script>
        (function () {
          const T0 = 31.4;
          const A = (s) => s - T0;
          const tl = gsap.timeline({ paused: true });

          // the held line: word by word, then three seconds of stillness (34.0–37.0)
          tl.fromTo("#f4-say .w", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out", stagger: 0.16 }, A(33.2));
          tl.fromTo("#f4-hair", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, A(33.9));
          tl.fromTo(["#f4-say", "#f4-hair"], { opacity: 1, y: 0 }, { opacity: 0, y: -14, duration: 0.5, ease: "power2.in", immediateRender: false }, A(37.0));

          // 37.0 — the esthetician observes the skin: focus pulls in, slow push
          tl.fromTo("#f4-b2", { opacity: 0, filter: "blur(16px)" }, { opacity: 1, filter: "blur(0px)", duration: 1.0, ease: "power2.out" }, A(37.0));
          tl.fromTo("#f4-b2", { scale: 1.0 }, { scale: 1.04, duration: 9.6, ease: "none" }, A(37.0));

          // three sheets at three depths, each on its spoken word, drifting at its own speed
          const sheets = [
            { w: "#f4-A", g: "#f4-gA", t: "#f4-tA", at: 37.4, drift: -20, to: { x: -308, y: 0 } },
            { w: "#f4-B", g: "#f4-gB", t: "#f4-tB", at: 38.6, drift: -30, to: { x: -228, y: -174 } },
            { w: "#f4-C", g: "#f4-gC", t: "#f4-tC", at: 39.8, drift: -40, to: { x: -148, y: -348 } },
          ];
          sheets.forEach((s) => {
            tl.fromTo(s.g, { "--g": 0, opacity: 0 }, { "--g": 1, opacity: 1, duration: 1.0, ease: "expo.out" }, A(s.at));
            tl.fromTo(s.t, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, A(s.at) + 0.15);
            tl.fromTo(s.w, { x: 0, y: 30 }, { x: 0, y: s.drift, duration: 42.0 - s.at, ease: "sine.out" }, A(s.at));
          });
          tl.fromTo("#f4-sheen", { xPercent: -120, opacity: 1 }, { xPercent: 260, opacity: 1, duration: 1.1, ease: "power2.inOut" }, A(37.9));

          // 42.0 — they file into one neat stack; focus on the front sheet
          sheets.forEach((s, i) => {
            tl.fromTo(s.w, { x: 0, y: s.drift }, { x: s.to.x, y: s.to.y, duration: 0.9, ease: "power3.inOut", immediateRender: false }, A(42.0) + i * 0.05);
            if (i > 0) {
              tl.fromTo(s.t, { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.in", immediateRender: false }, A(42.0));
              tl.fromTo(s.g, { opacity: 1 }, { opacity: i === 1 ? 0.5 : 0.28, duration: 0.6, ease: "sine.inOut", immediateRender: false }, A(42.2));
            }
          });
          tl.fromTo("#f4-adapt-in", { yPercent: 160 }, { yPercent: 0, duration: 0.9, ease: "power3.out" }, A(42.3));
          tl.fromTo("#f4-tag-in", { yPercent: 160 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, A(43.4));

          // 45.4–46.6 — the sheets part upward at three speeds and uncover the product texture
          tl.fromTo(["#f4-adapt", "#f4-tag"], { opacity: 1, y: 0 }, { opacity: 0, y: -30, duration: 0.5, ease: "power2.in", immediateRender: false }, A(45.3));
          sheets.forEach((s, i) => {
            tl.fromTo(s.w, { y: s.to.y }, { y: s.to.y - 1500, duration: 0.85 + i * 0.18, ease: "power2.in", immediateRender: false }, A(45.4) + i * 0.04);
          });
          tl.fromTo("#f4-fade", { opacity: 1 }, { opacity: 0, duration: 0.9, ease: "sine.inOut" }, A(45.7));

          window.__timelines["f4"] = tl;
        })();
