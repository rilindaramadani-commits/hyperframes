<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!-- Scène 2 — Le principe (7,2–20,4 s ; temps absolus du film dans le script, via A()).
           La machine en cabine ; le rail du protocole se trace ; UNE carte de verre présente
           tour à tour les 4 étapes sur le verbe dit, chacune avec un schéma au trait symbolique. -->
      <link rel="stylesheet" href="assets/hydraskin.css" />
      <style>
        @font-face { font-family: "Jost"; src: url("assets/fonts/jost-latin-300-normal.woff2") format("woff2"); font-weight: 300; }
        @font-face { font-family: "Jost"; src: url("assets/fonts/jost-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        @font-face { font-family: "Jost"; src: url("assets/fonts/jost-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
        #f2 { position: absolute; inset: 0; overflow: hidden; font-family: "Jost", sans-serif; color: var(--bdx-deep); }
        #f2-fade { position: absolute; inset: 0; }
        #f2-veil { background: var(--linen); opacity: 0; }
        #f2-label { position: absolute; left: 72px; top: 300px; }
        #f2-rail { left: 119px; top: 560px; height: 820px; }
        .f2-dot { left: 110px; }
        .f2-rl { position: absolute; left: 156px; font-size: 30px; line-height: 1; font-weight: 400; color: var(--bdx-deep); white-space: nowrap; }
        #f2-card { left: 380px; top: 700px; width: 600px; height: 460px; }
        .f2-step { position: absolute; left: 50px; top: 0; width: 520px; height: 460px; }
        .f2-num { position: absolute; left: 0; top: 48px; font-weight: 300; font-size: 30px; line-height: 1; letter-spacing: 0.08em; color: var(--bdx); }
        .f2-verb { position: absolute; left: 0; top: 96px; font-weight: 400; font-size: 72px; line-height: 1; color: var(--bdx-deep); white-space: nowrap; }
        .f2-sub { position: absolute; left: 0; top: 184px; font-weight: 300; font-size: 40px; line-height: 1; color: var(--bdx-deep); }
        .f2-svg { position: absolute; left: 0; top: 280px; width: 500px; height: 140px; overflow: visible; }
      </style>

      <div id="f2" data-composition-id="f2" data-width="1080" data-height="1920">
        <div id="f2-fade">
          <div class="hs-shot" id="f2-bg">
            <video id="f2-v1" class="clip" src="assets/media/IMG-08.mp4" muted playsinline data-start="0" data-duration="13.2" data-track-index="0"></video>
          </div>
          <div class="hs-veil" id="f2-veil"></div>

          <div id="f2-label" class="lbl"><span class="mask"><span id="f2-label-in">Le protocole</span></span></div>

          <div class="rail" id="f2-rail"></div>
          <div class="dot f2-dot" id="f2-d1" style="top: 590px"><i></i></div>
          <div class="dot f2-dot" id="f2-d2" style="top: 790px"><i></i></div>
          <div class="dot f2-dot" id="f2-d3" style="top: 990px"><i></i></div>
          <div class="dot f2-dot" id="f2-d4" style="top: 1190px"><i></i></div>
          <div class="f2-rl" id="f2-l1" style="top: 586px">Nettoyer</div>
          <div class="f2-rl" id="f2-l2" style="top: 786px">Exfolier</div>
          <div class="f2-rl" id="f2-l3" style="top: 986px">Extraire</div>
          <div class="f2-rl" id="f2-l4" style="top: 1186px">Hydrater</div>

          <div class="glass" id="f2-card">
            <div class="sheen" id="f2-sheen"></div>

            <div class="f2-step" id="f2-g1">
              <div class="f2-num">01</div>
              <div class="f2-verb">Nettoyer</div>
              <svg class="f2-svg" viewBox="0 0 500 140">
                <path id="f2-wave" d="M0 100 C 60 60, 120 140, 180 96 S 300 64, 360 104 S 460 120, 500 98" fill="none" stroke="#642D3D" stroke-opacity="0.7" stroke-width="3" />
                <path id="f2-flat" d="M0 100 L500 100" fill="none" stroke="#642D3D" stroke-opacity="0.7" stroke-width="3" stroke-dasharray="500" stroke-dashoffset="500" />
              </svg>
            </div>

            <div class="f2-step" id="f2-g2">
              <div class="f2-num">02</div>
              <div class="f2-verb">Exfolier</div>
              <svg class="f2-svg" viewBox="0 0 500 140">
                <path d="M0 100 L500 100" fill="none" stroke="#642D3D" stroke-opacity="0.7" stroke-width="3" />
                <g fill="#642D3D">
                  <circle class="f2-grain" cx="40" cy="90" r="5" /><circle class="f2-grain" cx="100" cy="92" r="4" />
                  <circle class="f2-grain" cx="165" cy="89" r="5" /><circle class="f2-grain" cx="230" cy="91" r="4" />
                  <circle class="f2-grain" cx="300" cy="90" r="5" /><circle class="f2-grain" cx="370" cy="92" r="4" />
                  <circle class="f2-grain" cx="440" cy="90" r="5" />
                </g>
                <line id="f2-pass" x1="0" y1="60" x2="0" y2="118" stroke="#642D3D" stroke-width="3" />
              </svg>
            </div>

            <div class="f2-step" id="f2-g3">
              <div class="f2-num">03</div>
              <div class="f2-verb">Extraire</div>
              <div class="f2-sub">les impuretés</div>
              <svg class="f2-svg" viewBox="0 0 500 140">
                <path d="M0 110 C 80 100, 160 120, 250 108 S 420 102, 500 110" fill="none" stroke="#642D3D" stroke-opacity="0.7" stroke-width="3" />
                <g fill="#642D3D" fill-opacity="0.6">
                  <circle class="f2-imp" cx="110" cy="98" r="5" /><circle class="f2-imp" cx="210" cy="100" r="5" />
                  <circle class="f2-imp" cx="300" cy="98" r="4.5" /><circle class="f2-imp" cx="390" cy="100" r="5" />
                </g>
              </svg>
            </div>

            <div class="f2-step" id="f2-g4">
              <div class="f2-num">04</div>
              <div class="f2-verb">Hydrater</div>
              <svg class="f2-svg" viewBox="0 0 500 140">
                <defs>
                  <clipPath id="f2-drop-clip"><path d="M60 10 C 60 10, 18 66, 18 92 a42 42 0 0 0 84 0 C 102 66, 60 10, 60 10 Z" /></clipPath>
                </defs>
                <rect id="f2-fill" x="10" y="0" width="100" height="140" fill="#D8C5B2" clip-path="url(#f2-drop-clip)" />
                <path d="M60 10 C 60 10, 18 66, 18 92 a42 42 0 0 0 84 0 C 102 66, 60 10, 60 10 Z" fill="none" stroke="#642D3D" stroke-opacity="0.8" stroke-width="3" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const T0 = 7.2;
          const A = (s) => s - T0; // storyboard times are absolute film times
          const tl = gsap.timeline({ paused: true });

          // machine in the cabin: slow push-in; frosted back when the card arrives
          tl.fromTo("#f2-bg", { scale: 1.0 }, { scale: 1.05, duration: 13.2, ease: "none" }, 0);
          tl.fromTo("#f2-bg", { filter: "blur(0px)" }, { filter: "blur(10px)", duration: 0.9, ease: "power2.inOut" }, A(13.4));
          tl.fromTo("#f2-veil", { opacity: 0 }, { opacity: 0.22, duration: 0.9, ease: "power2.inOut" }, A(13.4));

          // label, then the rail draws downward and its four empty points appear
          tl.fromTo("#f2-label-in", { yPercent: 160 }, { yPercent: 0, duration: 0.8, ease: "power3.out" }, A(8.6));
          tl.fromTo("#f2-rail", { scaleY: 0 }, { scaleY: 1, duration: 1.6, ease: "power2.inOut" }, A(8.8));
          tl.fromTo(".f2-dot", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out", stagger: 0.32 }, A(9.0));

          // the card condenses at the first verb
          const S = [13.8, 15.0, 16.2, 17.8];
          tl.fromTo("#f2-card", { "--g": 0, opacity: 0 }, { "--g": 1, opacity: 1, duration: 1.2, ease: "expo.out" }, A(S[0]));
          tl.fromTo("#f2-card", { y: 16 }, { y: 0, duration: 1.2, ease: "power3.out" }, A(S[0]));
          tl.fromTo("#f2-sheen", { xPercent: -120, opacity: 1 }, { xPercent: 260, opacity: 1, duration: 1.2, ease: "power2.inOut" }, A(S[0] + 0.5));

          // one card, four contents: each verb swaps in vertically on the spoken word
          const G = ["#f2-g1", "#f2-g2", "#f2-g3", "#f2-g4"];
          G.forEach((g, i) => {
            tl.fromTo(g, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, A(S[i]) + (i === 0 ? 0.25 : 0.05));
            if (i < 3) tl.fromTo(g, { opacity: 1, y: 0 }, { opacity: 0, y: -22, duration: 0.35, ease: "power2.in", immediateRender: false }, A(S[i + 1]) - 0.3);
            // the rail point fills and its name is written beside it
            tl.fromTo(`#f2-d${i + 1} > i`, { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, A(S[i]) + 0.1);
            tl.fromTo(`#f2-l${i + 1}`, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, A(S[i]) + 0.15);
          });

          // the four line drawings — symbolic, never pseudo-medical
          tl.fromTo("#f2-wave", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "sine.inOut" }, A(S[0]) + 0.6);
          tl.fromTo("#f2-flat", { strokeDashoffset: 500 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.inOut" }, A(S[0]) + 0.6);
          tl.fromTo("#f2-pass", { x: 0 }, { x: 500, duration: 0.95, ease: "power1.inOut" }, A(S[1]) + 0.25);
          tl.fromTo(".f2-grain", { opacity: 1 }, { opacity: 0.12, duration: 0.25, ease: "none", stagger: 0.12 }, A(S[1]) + 0.3);
          tl.fromTo(".f2-imp", { y: 0, opacity: 0.9 }, { y: -70, opacity: 0, duration: 0.9, ease: "power2.out", stagger: 0.12 }, A(S[2]) + 0.4);
          tl.fromTo("#f2-fill", { y: 120 }, { y: 0, duration: 1.1, ease: "power2.inOut" }, A(S[3]) + 0.3);

          // 19.4–20.4 — the card retracts into the chip of scene 3 (top left)
          tl.fromTo("#f2-g4", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, A(19.4));
          tl.fromTo("#f2-card", { x: 0, scaleX: 1, scaleY: 1 }, { x: -393, y: -622, scaleX: 0.717, scaleY: 0.209, duration: 0.6, ease: "power3.inOut", immediateRender: false }, A(19.5));
          tl.fromTo("#f2-fade", { opacity: 1 }, { opacity: 0, duration: 0.6, ease: "sine.inOut" }, A(19.8));

          window.__timelines["f2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
