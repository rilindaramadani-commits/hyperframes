<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <!-- Scène 3 — La technologie en action (19,4–33,0 s ; temps absolus via A()).
           Quatre gros plans de gestes ; la carte de la scène 2 devenue puce indique l'étape ;
           trois annotations au trait fin partent du point de contact vers l'espace libre. -->
      <link rel="stylesheet" href="assets/hydraskin.css" />
      <style>
        @font-face { font-family: "Jost"; src: url("assets/fonts/jost-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
        #f3 { position: absolute; inset: 0; overflow: hidden; font-family: "Jost", sans-serif; color: var(--bdx-deep); }
        #f3-fade { position: absolute; inset: 0; }
        #f3-veil { background: var(--linen); opacity: 0; }
        #f3-s1 { transform-origin: 540px 980px; }
        #f3-s2 { transform-origin: 440px 990px; }
        #f3-s3 { transform-origin: 730px 650px; }
        #f3-s4 { transform-origin: 675px 730px; }
        #f3-chip { left: 72px; top: 260px; width: 430px; height: 96px; }
        .f3-step { position: absolute; left: 40px; top: 30px; font-size: 36px; line-height: 1; font-weight: 400; color: var(--bdx-deep); white-space: nowrap; }
        .f3-step b { font-weight: 400; color: var(--bdx); }
        .f3-mini { position: absolute; top: 41px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--bdx); }
        .f3-mini > i { position: absolute; inset: 1px; border-radius: 50%; background: var(--bdx); display: block; }
        #f3-ann { position: absolute; inset: 0; width: 1080px; height: 1920px; overflow: visible; }
        .f3-pt { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--cream); box-shadow: 0 0 0 7px rgba(247, 242, 235, 0.35); }
        .f3-tag { position: absolute; font-size: 32px; line-height: 1; font-weight: 400; color: var(--bdx-deep); white-space: nowrap; background: rgba(247, 242, 235, 0.66); border-radius: 10px; padding: 12px 18px; }
      </style>

      <div data-hf-id="hf-dnux" id="f3" data-composition-id="f3" data-width="1080" data-height="1920">
        <div data-hf-id="hf-lnu3" id="f3-fade">
          <div data-hf-id="hf-b08k" class="hs-shot" id="f3-s1"><video data-hf-id="hf-p30d" id="f3-v1" class="clip" src="assets/media/IMG-04.mp4" muted playsinline data-start="0" data-duration="4.2" data-track-index="0"></video></div>
          <div data-hf-id="hf-jo4f" class="hs-shot" id="f3-s2"><video data-hf-id="hf-467n" id="f3-v2" class="clip" src="assets/media/IMG-05.mp4" muted playsinline data-start="3.3" data-duration="3.6" data-track-index="1"></video></div>
          <div data-hf-id="hf-fq0e" class="hs-shot" id="f3-s3"><video data-hf-id="hf-xzs9" id="f3-v3" class="clip" src="assets/media/IMG-06.mp4" muted playsinline data-start="6.3" data-duration="3.6" data-track-index="2"></video></div>
          <div data-hf-id="hf-qli1" class="hs-shot" id="f3-s4"><video data-hf-id="hf-6t3t" id="f3-v4" class="clip" src="assets/media/IMG-07.mp4" muted playsinline data-start="9.3" data-duration="4.3" data-track-index="3"></video></div>
          <div data-hf-id="hf-h2a4" class="hs-veil" id="f3-veil"></div>

          <!-- annotations: point on the gesture → hairline → label in free space -->
          <svg data-hf-id="hf-avut" id="f3-ann" viewBox="0 0 1080 1920">
            <path data-hf-id="hf-0ix0" id="f3-p2" d="M440 990 L640 760 L900 760" fill="none" stroke="#F7F2EB" stroke-width="3" stroke-dasharray="565" stroke-dashoffset="565" />
            <path data-hf-id="hf-2f3k" id="f3-p3" d="M730 650 L820 430 L560 430" fill="none" stroke="#F7F2EB" stroke-width="3" stroke-dasharray="498" stroke-dashoffset="498" />
          </svg>
          <div data-hf-id="hf-4vaz" class="f3-pt" id="f3-pt2" style="left: 440px; top: 990px"></div>
          <div data-hf-id="hf-dvrb" class="f3-pt" id="f3-pt3" style="left: 730px; top: 650px"></div>
          <div data-hf-id="hf-5a99" class="f3-tag" id="f3-t2" style="left: 652px; top: 686px">Précision</div>
          <div data-hf-id="hf-a8e2" class="f3-tag" id="f3-t3" style="left: 560px; top: 352px">Chaque zone du visage</div>

          <!-- the step chip (scene 2's card, retracted) with its mini rail -->
          <div data-hf-id="hf-ad2h" class="glass pill" id="f3-chip">
            <div data-hf-id="hf-m93x" class="f3-step" id="f3-c1"><b data-hf-id="hf-27a2">01</b> · Nettoyer</div>
            <div data-hf-id="hf-4g9y" class="f3-step" id="f3-c2"><b data-hf-id="hf-2ll3">02</b> · Exfolier</div>
            <div data-hf-id="hf-jo3d" class="f3-step" id="f3-c3"><b data-hf-id="hf-2zw4">03</b> · Extraire</div>
            <div data-hf-id="hf-ymvt" class="f3-step" id="f3-c4"><b data-hf-id="hf-3e75">04</b> · Hydrater</div>
            <div data-hf-id="hf-ub6y" class="f3-mini" style="left: 312px"><i data-hf-id="hf-jubf" id="f3-m1"></i></div>
            <div data-hf-id="hf-ppqg" class="f3-mini" style="left: 336px"><i data-hf-id="hf-b6fk" id="f3-m2"></i></div>
            <div data-hf-id="hf-1pol" class="f3-mini" style="left: 360px"><i data-hf-id="hf-by3d" id="f3-m3"></i></div>
            <div data-hf-id="hf-usb3" class="f3-mini" style="left: 384px"><i data-hf-id="hf-12lq" id="f3-m4"></i></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const T0 = 19.4;
          const A = (s) => s - T0;
          const tl = gsap.timeline({ paused: true });

          // four gestures, each a slow push toward its point of contact
          const shots = ["#f3-s1", "#f3-s2", "#f3-s3", "#f3-s4"];
          const starts = [19.4, 22.7, 25.7, 28.7];
          shots.forEach((s, i) => {
            tl.fromTo(s, { scale: 1.0 }, { scale: 1.07, duration: (i === 3 ? 33.0 : starts[i + 1] + 0.6) - starts[i], ease: "none" }, A(starts[i]));
            if (i > 0) {
              // motivated dissolve: the incoming gesture resolves out of a slight blur
              tl.fromTo(s, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "sine.inOut" }, A(starts[i] + 0.0));
            }
          });

          // chip condenses where scene 2's card retracted
          tl.fromTo("#f3-chip", { "--g": 0, opacity: 0 }, { "--g": 1, opacity: 1, duration: 0.6, ease: "expo.out" }, A(19.9));
          const C = [19.95, 23.0, 26.0, 29.0];
          ["#f3-c1", "#f3-c2", "#f3-c3", "#f3-c4"].forEach((c, i) => {
            tl.fromTo(c, { opacity: 0, yPercent: 60 }, { opacity: 1, yPercent: 0, duration: 0.35, ease: "power3.out" }, A(C[i]) + 0.05);
            if (i < 3) tl.fromTo(c, { opacity: 1, yPercent: 0 }, { opacity: 0, yPercent: -60, duration: 0.3, ease: "power2.in", immediateRender: false }, A(C[i + 1]) - 0.3);
            tl.fromTo(`#f3-m${i + 1}`, { scale: 0 }, { scale: 1, duration: 0.4, ease: "back.out(2)" }, A(C[i]) + 0.25);
          });

          // annotations: drawn 0.6 s, held 1.8 s, folded back — on three shots only
          const ann = [
            { p: "#f3-p2", pt: "#f3-pt2", t: "#f3-t2", len: 565, at: 23.5 },
            { p: "#f3-p3", pt: "#f3-pt3", t: "#f3-t3", len: 498, at: 26.5 },
          ];
          ann.forEach((a) => {
            tl.fromTo(a.pt, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)" }, A(a.at));
            tl.fromTo(a.p, { strokeDashoffset: a.len }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, A(a.at) + 0.1);
            tl.fromTo(a.t, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, A(a.at) + 0.55);
            tl.fromTo(a.t, { opacity: 1 }, { opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, A(a.at) + 2.4);
            tl.fromTo(a.p, { strokeDashoffset: 0 }, { strokeDashoffset: -a.len, duration: 0.45, ease: "power2.in", immediateRender: false }, A(a.at) + 2.45);
            tl.fromTo(a.pt, { scale: 1, opacity: 1 }, { scale: 0, opacity: 0, duration: 0.3, ease: "power2.in", immediateRender: false }, A(a.at) + 2.75);
          });

          // 31.4–33.0 — focus opens: the last gesture melts into a creamy linen blur
          tl.fromTo("#f3-chip", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "power2.in", immediateRender: false }, A(31.4));
          tl.fromTo("#f3-s4", { filter: "blur(0px)" }, { filter: "blur(28px)", duration: 1.2, ease: "power2.inOut", immediateRender: false }, A(31.4));
          tl.fromTo("#f3-veil", { opacity: 0 }, { opacity: 0.55, duration: 1.2, ease: "power2.inOut" }, A(31.4));
          tl.fromTo("#f3-fade", { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "sine.inOut" }, A(32.5));

          window.__timelines["f3"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
