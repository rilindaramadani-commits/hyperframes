  <script>
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#istighfar-scene", { scale: 1 }, { scale: 1.03, duration: 3.8, ease: "sine.out" }, 0);

    // Le numéro arrive, puis l'étiquette.
    tl.fromTo("#istighfar-badge", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.8)" }, 0);
    tl.fromTo("#istighfar-label", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);

    // Le soleil traverse le ciel : de l'aube au coucher, l'istighfar ne s'arrête pas.
    const istighfarSoleil = document.querySelectorAll("#istighfar-soleil circle");
    const istighfarCourse = { a: -90 };
    const istighfarPlace = () => {
      const r = (istighfarCourse.a * Math.PI) / 180;
      const x = (150 + 120 * Math.sin(r)).toFixed(2);
      const y = (180 - 120 * Math.cos(r)).toFixed(2);
      istighfarSoleil.forEach((c) => {
        c.setAttribute("cx", x);
        c.setAttribute("cy", y);
      });
    };
    tl.fromTo(istighfarCourse, { a: -90 }, { a: 90, duration: 3.0, ease: "sine.inOut", onUpdate: istighfarPlace }, 0.25);
    tl.fromTo("#istighfar-arc", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 3.0, ease: "sine.inOut" }, 0.25);

    // L'arabe s'écrit de droite à gauche.
    tl.fromTo("#istighfar-ar-masque", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.85, ease: "power2.inOut" }, 0.4);
    // Le français sort du flou, mot après mot.
    tl.fromTo("#istighfar-fr .istighfar-m", { opacity: 0, filter: "blur(10px)", y: 18 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.55, ease: "power2.out", stagger: 0.09 }, 0.85);
    tl.fromTo("#istighfar-sous", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.1);

    // Sortie : dissolution dans un léger flou.
    tl.fromTo("#istighfar-scene", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(10px)", duration: 0.32, ease: "power2.in", immediateRender: false }, 3.46);

    window.__timelines["istighfar"] = tl;
  </script>
