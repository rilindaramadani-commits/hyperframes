  <script>
    const tl = gsap.timeline({ paused: true });

    // Lente poussée (ou recul) de caméra dans chaque plan — sur le cadre, jamais sur la vidéo.
    const push = (sel, start, dur, from, to) =>
      tl.fromTo(sel, { scale: from }, { scale: to, duration: dur, ease: "sine.inOut" }, start);
    push("#plans-cadre-mosquee-1", 0.0, 3.4, 1.0, 1.06);
    push("#plans-cadre-coran-main", 3.4, 3.4, 1.06, 1.0);
    push("#plans-cadre-priere", 6.8, 3.4, 1.0, 1.07);
    push("#plans-cadre-table", 10.2, 3.8, 1.08, 1.0);
    push("#plans-cadre-mosquee-2", 14.0, 3.8, 1.0, 1.06);

    // Intensité du voile selon la luminosité de chaque plan.
    const teinte = [
      [0.0, 0.06],
      [3.4, 0.02],
      [6.8, 0.0],
      [10.2, 0.24],
      [14.0, 0.12],
    ];
    teinte.forEach(([t, o], i) => {
      const avant = i === 0 ? o : teinte[i - 1][1];
      tl.fromTo("#plans-teinte", { opacity: avant }, { opacity: o, duration: 0.01, ease: "none", immediateRender: i === 0 }, t);
    });

    // Chaque coupe passe par un bref fondu au noir, en phase avec la sortie du texte.
    tl.fromTo("#plans-coupe", { opacity: 0.55 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, 0);
    [3.4, 6.8, 10.2, 14.0].forEach((t) => {
      tl.fromTo("#plans-coupe", { opacity: 0 }, { opacity: 0.6, duration: 0.16, ease: "power2.in", immediateRender: false }, t - 0.16);
      tl.fromTo("#plans-coupe", { opacity: 0.6 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t);
    });

    window.__timelines["plans"] = tl;
  </script>
