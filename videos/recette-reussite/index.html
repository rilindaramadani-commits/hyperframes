<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-garamond-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2");
        font-weight: 500;
        font-style: italic;
      }
      @font-face {
        font-family: "Cormorant Garamond";
        src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("assets/fonts/plus-jakarta-sans-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Plus Jakarta Sans";
        src: url("assets/fonts/plus-jakarta-sans-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
      }
      @font-face {
        font-family: "Amiri";
        src: url("assets/fonts/amiri-arabic-400-normal.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "Amiri";
        src: url("assets/fonts/amiri-arabic-700-normal.woff2") format("woff2");
        font-weight: 700;
      }

      :root {
        --nuit: #080c20;
        --nuit-2: #151a3d;
        --or: #e4c47f;
        --or-clair: #f6e3b4;
        --encre: #f8f2e4;
        --doux: #b8b2cc;
        --serif: "Cormorant Garamond", serif;
        --sans: "Plus Jakarta Sans", sans-serif;
        --arabe: "Amiri", serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--nuit);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="17.8" data-width="1080" data-height="1920">
      <!-- Piste 0 · Fond animé (ciel de nuit + motif géométrique). Les séquences vidéo viendront ici. -->
      <div id="ciel" data-composition-id="ciel" data-composition-src="compositions/ciel.html" data-start="0" data-duration="17.8" data-track-index="0" data-width="1080" data-height="1920" style="z-index: 0"></div>

      <!-- Piste 1 · Les scènes -->
      <div id="accroche" data-composition-id="accroche" data-composition-src="compositions/accroche.html" data-start="0" data-duration="3.4" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="baqara" data-composition-id="baqara" data-composition-src="compositions/baqara.html" data-start="3.4" data-duration="3.4" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="tahajjud" data-composition-id="tahajjud" data-composition-src="compositions/tahajjud.html" data-start="6.8" data-duration="3.4" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="istighfar" data-composition-id="istighfar" data-composition-src="compositions/istighfar.html" data-start="10.2" data-duration="3.8" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 10"></div>
      <div id="formule" data-composition-id="formule" data-composition-src="compositions/formule.html" data-start="14.0" data-duration="3.8" data-track-index="1" data-width="1080" data-height="1920" style="z-index: 10"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
