<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #bg-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #050d0a;
        }
      /* Shared night backdrop under every scene */
      #bg-glow-top {
        position: absolute;
        left: -30%;
        top: -22%;
        width: 160%;
        height: 80%;
        background: radial-gradient(closest-side, rgba(31, 122, 90, 0.42), rgba(15, 61, 46, 0.18) 55%, rgba(5, 13, 10, 0) 100%);
      }
      #bg-glow-low {
        position: absolute;
        left: -10%;
        top: 46%;
        width: 120%;
        height: 60%;
        background: radial-gradient(closest-side, rgba(201, 164, 92, 0.16), rgba(201, 164, 92, 0.05) 60%, rgba(5, 13, 10, 0) 100%);
      }
      #bg-vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 85% at 50% 48%, rgba(5, 13, 10, 0) 55%, rgba(2, 6, 5, 0.85) 100%);
      }
      #dust {
        position: absolute;
        inset: 0;
      }
      .mote {
        position: absolute;
        display: block;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(240, 217, 160, 0.95) 0%, rgba(230, 201, 138, 0.35) 45%, rgba(230, 201, 138, 0) 70%);
      }
      #grain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0.07;
        mix-blend-mode: screen;
      }
      </style>
      <div id="bg-root" data-composition-id="bg" data-width="1080" data-height="1920">
        <div id="bg-glow-top" data-layout-allow-overflow></div>
        <div id="bg-glow-low" data-layout-allow-overflow></div>
        <div id="dust"></div>
        <canvas id="grain" width="540" height="960"></canvas>
        <div id="bg-vignette"></div>
      </div>
      <script>
      // ---- deterministic helpers
      function mulberry32(a) {
        return function () {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = mulberry32(1447);
      const TOTAL = 167;

      // ---- static film grain (seeded, drawn once)
      (function () {
        const c = document.getElementById("grain");
        const ctx = c.getContext("2d");
        const img = ctx.createImageData(c.width, c.height);
        const g = mulberry32(7);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = Math.floor(g() * 255);
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
      })();

      // ---- golden dust motes
      const dust = document.getElementById("dust");
      const motes = [];
      for (let i = 0; i < 44; i++) {
        const el = document.createElement("span");
        el.className = "mote";
        const size = 4 + rand() * 10;
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.style.left = (rand() * 1080).toFixed(1) + "px";
        el.style.top = (rand() * 1920).toFixed(1) + "px";
        dust.appendChild(el);
        motes.push({ el, drift: 140 + rand() * 260, sway: 20 + rand() * 40, period: 5 + rand() * 6, base: 0.25 + rand() * 0.5, phase: rand() * 6 });
      }

      const tl = gsap.timeline({ paused: true });

      motes.forEach((m) => {
        tl.fromTo(m.el, { y: 0 }, { y: -m.drift, duration: TOTAL, ease: "none" }, 0);
        const reps = Math.max(0, Math.floor(TOTAL / m.period) - 1);
        tl.fromTo(
          m.el,
          { opacity: m.base * 0.25, x: -m.sway / 2 },
          { opacity: m.base, x: m.sway / 2, duration: m.period / 2, ease: "sine.inOut", yoyo: true, repeat: reps * 2 + 1 },
          m.phase % 3
        );
      });

      // slow breathing of the two glows
      tl.fromTo("#bg-glow-top", { scale: 1, opacity: 0.85 }, { scale: 1.08, opacity: 1, duration: 9, ease: "sine.inOut", yoyo: true, repeat: 17 }, 0);
      tl.fromTo("#bg-glow-low", { scale: 1.05, opacity: 0.7 }, { scale: 0.95, opacity: 1, duration: 11, ease: "sine.inOut", yoyo: true, repeat: 13 }, 0);

      window.__timelines["bg"] = tl;
    </script>
    </template>
  </body>
</html>
