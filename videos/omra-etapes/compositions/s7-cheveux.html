<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s7-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s7-all {
          position: absolute;
          inset: 0;
        }
        #s7-visual {
          position: absolute;
          left: 0;
          top: 560px;
          width: 1080px;
          height: 620px;
        }
        #s7-visual svg {
          width: 100%;
          height: 100%;
          display: block;
          overflow: visible;
        }
        .s7-card {
          opacity: 0;
        }
        .s7-card .o-text + .o-text {
          margin-top: 22px;
        }
      </style>

      <div id="s7-root" data-composition-id="s7-cheveux" data-width="1080" data-height="1920">
        <div id="s7-all">
          <div class="o-head">
            <div class="o-step"><span class="o-rule" id="s7-rule"></span><span id="s7-stepl">Étape 5</span></div>
            <div class="o-title" id="s7-title">Raser ou raccourcir les cheveux</div>
            <div><span class="o-badge" id="s7-badge">Obligation <span class="o-badge-sub">· selon la majorité des savants</span></span></div>
          </div>

          <div id="s7-visual">
            <svg viewBox="0 0 1080 620" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <radialGradient id="s7-halo">
                  <stop offset="0" stop-color="#e6c98a" stop-opacity="0.4" />
                  <stop offset="0.5" stop-color="#c9a45c" stop-opacity="0.1" />
                  <stop offset="1" stop-color="#c9a45c" stop-opacity="0" />
                </radialGradient>
                <linearGradient id="s7-strandg" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0" stop-color="#e6c98a" stop-opacity="0" />
                  <stop offset="0.2" stop-color="#e6c98a" />
                  <stop offset="1" stop-color="#f5efe2" />
                </linearGradient>
              </defs>
              <circle id="s7-haloc" cx="540" cy="310" r="300" fill="url(#s7-halo)" />
              <circle id="s7-release" cx="540" cy="310" r="60" fill="none" stroke="#f5efe2" stroke-width="3" opacity="0" />
              <circle id="s7-release2" cx="540" cy="310" r="60" fill="none" stroke="#e6c98a" stroke-width="2" opacity="0" />
              <!-- the strand -->
              <path id="s7-strand" d="M 150 310 C 260 250, 360 370, 470 310 S 640 250, 700 300" fill="none" stroke="url(#s7-strandg)" stroke-width="6" stroke-linecap="round" />
              <g id="s7-tip-wrap">
                <path id="s7-tip" d="M 700 300 C 718 316, 738 322, 772 312" fill="none" stroke="#f5efe2" stroke-width="6" stroke-linecap="round" />
              </g>
              <!-- scissors (pictogram) -->
              <g transform="translate(838 306)">
                <g id="s7-sc">
                  <g id="s7-bladeA">
                    <polyline points="64,18 0,0 -176,-4" fill="none" stroke="#e6c98a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="90" cy="30" r="26" fill="none" stroke="#e6c98a" stroke-width="7" />
                  </g>
                  <g id="s7-bladeB">
                    <polyline points="64,-18 0,0 -176,4" fill="none" stroke="#c9a45c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
                    <circle cx="90" cy="-30" r="26" fill="none" stroke="#c9a45c" stroke-width="7" />
                  </g>
                  <circle cx="0" cy="0" r="7" fill="#050d0a" stroke="#f5efe2" stroke-width="3" />
                </g>
              </g>
            </svg>
          </div>

          <div class="o-card s7-card" id="s7-c1">
            <div class="o-text"><strong>Hommes</strong>&nbsp;: se raser la tête ou raccourcir les cheveux — le rasage est généralement considéré comme préférable.</div>
            <div class="o-text"><strong>Femmes</strong>&nbsp;: couper une petite partie à l'extrémité des cheveux, environ la longueur d'une phalange.</div>
          </div>
          <div class="o-card s7-card" id="s7-c2">
            <div class="o-text">Cette étape <strong>achève la Omra</strong>&nbsp;: on sort alors de l'état d'ihram et ses interdits sont levés.</div>
            <div class="o-note">Statuts indiqués selon l'avis majoritaire&nbsp;; les écoles juridiques divergent sur certains détails.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const strand = document.getElementById("s7-strand");
          const L = strand.getTotalLength();
          strand.style.strokeDasharray = L;
          strand.style.strokeDashoffset = L;
          const tip = document.getElementById("s7-tip");
          const TL = tip.getTotalLength();
          tip.style.strokeDasharray = TL;
          tip.style.strokeDashoffset = TL;

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s7-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0.2);
          tl.fromTo("#s7-stepl", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 0.4);
          tl.fromTo("#s7-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 1.0, ease: "power3.out" }, 0.6);
          tl.fromTo("#s7-badge", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.6)" }, 1.1);

          tl.fromTo("#s7-haloc", { opacity: 0, scale: 0.7, transformOrigin: "540px 310px" }, { opacity: 1, scale: 1, duration: 2.2, ease: "sine.out" }, 0.6);
          tl.to(strand, { strokeDashoffset: 0, duration: 2.0, ease: "power2.inOut" }, 1.0);
          tl.to(tip, { strokeDashoffset: 0, duration: 0.5, ease: "power1.out" }, 2.8);
          // scissors glide in open, then close once, gently
          tl.fromTo("#s7-sc", { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 1.4, ease: "power3.out" }, 2.6);
          tl.fromTo("#s7-bladeA", { rotation: -16, svgOrigin: "0 0" }, { rotation: 0, svgOrigin: "0 0", duration: 0.35, ease: "power3.in" }, 4.6);
          tl.fromTo("#s7-bladeB", { rotation: 16, svgOrigin: "0 0" }, { rotation: 0, svgOrigin: "0 0", duration: 0.35, ease: "power3.in" }, 4.6);
          // the small cut piece drifts down and fades
          tl.to("#s7-tip-wrap", { y: 110, x: 18, rotation: 14, svgOrigin: "736 312", opacity: 0, duration: 1.8, ease: "power1.in" }, 5.0);
          tl.to("#s7-sc", { opacity: 0, x: 90, duration: 1.0, ease: "power2.in" }, 5.8);
          // release of ihram: two soft waves of light
          [["#s7-release", 300, 0.9, 8.6], ["#s7-release2", 260, 0.7, 9.0]].forEach(([id, r, o, t]) => {
            tl.fromTo(id, { attr: { r: 40 } }, { attr: { r: r }, duration: 2.4, ease: "power2.out" }, t);
            tl.fromTo(id, { opacity: 0 }, { opacity: o, duration: 0.15 }, t);
            tl.to(id, { opacity: 0, duration: 2.2, ease: "power2.out" }, t + 0.2);
          });
          tl.to("#s7-strand", { strokeWidth: 8, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 8.6);
          tl.fromTo("#s7-haloc", { scale: 1 }, { scale: 1.15, duration: 2.4, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 8.6);

          tl.fromTo("#s7-c1", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.4);
          tl.to("#s7-c1", { opacity: 0, y: -18, duration: 0.5, ease: "power1.in" }, 8.0);
          tl.fromTo("#s7-c2", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 8.7);

          tl.to("#s7-all", { opacity: 0, y: -24, duration: 0.9, ease: "power1.in" }, 15.1);
          window.__timelines["s7-cheveux"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
