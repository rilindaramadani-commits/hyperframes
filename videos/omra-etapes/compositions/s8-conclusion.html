<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #s8-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        #s8-all {
          position: absolute;
          inset: 0;
        }
        #s8-beam {
          position: absolute;
          left: 290px;
          top: -200px;
          width: 500px;
          height: 1300px;
          background: radial-gradient(50% 60% at 50% 0%, rgba(240, 217, 160, 0.26), rgba(240, 217, 160, 0.06) 60%, rgba(240, 217, 160, 0) 100%);
        }
        #s8-halo {
          position: absolute;
          left: -10px;
          top: 170px;
          width: 1100px;
          height: 1100px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(230, 201, 138, 0.4), rgba(201, 164, 92, 0.13) 50%, rgba(201, 164, 92, 0) 100%);
        }
        #s8-rings {
          position: absolute;
          left: 0;
          top: 700px;
          width: 1080px;
          height: 420px;
        }
        #s8-kaaba {
          position: absolute;
          left: 20px;
          top: 240px;
          width: 1040px;
          height: 936px;
        }
        #s8-text {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 1090px;
          text-align: center;
        }
        #s8-l1 {
          font: 400 82px/1.12 "Marcellus", serif;
          color: var(--gold-l);
          text-wrap: balance;
        }
        #s8-l2 {
          margin-top: 34px;
          font: 300 48px/1.34 "Jost", sans-serif;
          color: var(--ivory);
          text-wrap: balance;
        }
        #s8-l3 {
          margin-top: 40px;
          font: 400 30px/1.4 "Jost", sans-serif;
          color: var(--sand);
        }
      </style>

      <div id="s8-root" data-composition-id="s8-conclusion" data-width="1080" data-height="1920">
        <div id="s8-all">
          <div id="s8-beam"></div>
          <div id="s8-halo"></div>
          <svg id="s8-rings" viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="#e6c98a">
              <ellipse class="s8-ring" cx="540" cy="210" rx="380" ry="80" stroke-opacity="0.45" stroke-width="2.5" />
              <ellipse class="s8-ring" cx="540" cy="210" rx="460" ry="100" stroke-opacity="0.28" stroke-width="2" />
              <ellipse class="s8-ring" cx="540" cy="210" rx="530" ry="122" stroke-opacity="0.15" stroke-width="2" />
            </g>
          </svg>
          <div id="s8-kaaba"></div>
          <div id="s8-text">
            <div id="s8-l1">Qu'Allah accepte votre Omra.</div>
            <div id="s8-l2">Qu'Il vous accorde sincérité, facilité et acceptation.</div>
            <div id="s8-l3">Pour toute question précise, rapprochez-vous d'une personne de science de confiance.</div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          document.getElementById("s8-kaaba").innerHTML = window.OmraArt.kaaba("s8k");
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s8-kaaba", { opacity: 0, scale: 1.06, filter: "brightness(0.4)" }, { opacity: 1, scale: 1, filter: "brightness(1)", duration: 3.2, ease: "power2.out" }, 0.2);
          tl.fromTo("#s8-kaaba", { scale: 1 }, { scale: 1.06, duration: 12.4, ease: "sine.inOut", immediateRender: false }, 3.4);
          tl.fromTo("#s8-halo", { opacity: 0, scale: 0.75 }, { opacity: 1, scale: 1, duration: 3.6, ease: "sine.out" }, 0.6);
          tl.fromTo("#s8-halo", { scale: 1 }, { scale: 1.08, duration: 3.0, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 4.2);
          tl.fromTo("#s8-beam", { opacity: 0 }, { opacity: 1, duration: 4, ease: "sine.inOut" }, 1.0);
          tl.fromTo("#s8-beam", { opacity: 1 }, { opacity: 0.6, duration: 2.6, ease: "sine.inOut", yoyo: true, repeat: 3, immediateRender: false }, 5.0);
          tl.fromTo(".s8-ring", { opacity: 0, scale: 0.8, transformOrigin: "540px 210px" }, { opacity: 1, scale: 1, duration: 2.2, ease: "power2.out", stagger: 0.35 }, 1.4);

          tl.fromTo("#s8-l1", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.6, ease: "power3.out" }, 2.4);
          tl.fromTo("#s8-l2", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 1.4, ease: "power2.out" }, 5.2);
          tl.fromTo("#s8-l3", { opacity: 0 }, { opacity: 0.9, duration: 1.4, ease: "sine.out" }, 8.0);
          window.__timelines["s8-conclusion"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
