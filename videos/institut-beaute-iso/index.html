<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Institut — Publicité 3D isométrique</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/vendor/three.module.min.js",
          "three/addons/": "./assets/vendor/addons/"
        }
      }
    </script>
    <style>
      @font-face {
        font-family: "Marcellus";
        src: url("assets/fonts/marcellus-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Jost";
        src: url("assets/fonts/jost-latin-300-normal.woff2") format("woff2");
        font-weight: 300;
        font-style: normal;
      }
      @font-face {
        font-family: "Jost";
        src: url("assets/fonts/jost-latin-400-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "Jost";
        src: url("assets/fonts/jost-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
      }

      :root {
        --ivory: #f7f0e8;
        --nude: #e6d2c3;
        --champagne: #e9d8bc;
        --blush: #efd3cc;
        --gold: #a37b4c;
        --gold-light: #cfa977;
        --ink: #33241a;
        --ink-soft: #5a4434;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ivory);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Jost", sans-serif;
        color: var(--ink);
        background: radial-gradient(120% 80% at 50% 42%, #faf4ec 0%, #f1e5d7 55%, #e4d1bd 100%);
      }

      #iso {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* soft ivory veil at the top so titles always sit on a calm ground */
      #veil-top {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 1000px;
        background: linear-gradient(
          180deg,
          rgba(248, 241, 232, 0.97) 0%,
          rgba(248, 241, 232, 0.93) 48%,
          rgba(248, 241, 232, 0.66) 72%,
          rgba(248, 241, 232, 0) 100%
        );
        opacity: 0;
        pointer-events: none;
      }
      #veil-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 900px;
        background: linear-gradient(
          0deg,
          rgba(248, 241, 232, 0.97) 0%,
          rgba(248, 241, 232, 0.9) 40%,
          rgba(248, 241, 232, 0.5) 70%,
          rgba(248, 241, 232, 0) 100%
        );
        opacity: 0;
        pointer-events: none;
      }
      #vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          110% 75% at 50% 50%,
          rgba(0, 0, 0, 0) 60%,
          rgba(120, 88, 66, 0.14) 100%
        );
        pointer-events: none;
      }
      #leak {
        position: absolute;
        left: 0;
        top: 0;
        width: 1400px;
        height: 1400px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 236, 214, 0.85) 0%,
          rgba(250, 214, 196, 0.45) 35%,
          rgba(255, 240, 225, 0) 70%
        );
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- text system ---------- */
      .scene {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 250px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 110px;
      }
      .mask {
        display: block;
        overflow: hidden;
        padding: 0.1em 0.1em 0.2em;
      }
      .mask > span {
        display: block;
      }
      .title {
        font-family: "Marcellus", serif;
        font-weight: 400;
        font-size: 82px;
        line-height: 1.08;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .tagline {
        font-family: "Marcellus", serif;
        font-weight: 400;
        font-size: 104px;
        line-height: 1.02;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .display {
        font-family: "Marcellus", serif;
        font-weight: 400;
        font-size: 96px;
        line-height: 1.06;
        letter-spacing: 0;
        color: var(--ink);
      }
      .sub {
        font-family: "Jost", sans-serif;
        font-weight: 300;
        font-size: 50px;
        line-height: 1.28;
        letter-spacing: 0.02em;
        color: var(--ink-soft);
        max-width: 820px;
      }
      .rule {
        display: block;
        width: 220px;
        height: 2px;
        margin: 34px auto 30px;
        background: linear-gradient(90deg, rgba(163, 123, 76, 0), #a37b4c 30%, #cfa977 50%, #a37b4c 70%, rgba(163, 123, 76, 0));
        transform-origin: 50% 50%;
      }
      .diamond {
        display: block;
        width: 12px;
        height: 12px;
        margin: 0 auto;
        border: 1.5px solid var(--gold);
        transform: rotate(45deg);
      }

      /* AMANI SKIN lockup: wordmark from the client's logo, SKIN row redrawn clean */
      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 40px;
      }
      .wordmark-wrap {
        position: relative;
        width: 600px;
        height: 156px;
      }
      .wordmark {
        display: block;
        width: 600px;
        height: 156px;
      }
      /* gold light that sweeps across the letters, masked by the wordmark */
      .wordmark-sheen {
        position: absolute;
        inset: 0;
        background: linear-gradient(100deg, rgba(232, 205, 160, 0) 38%, rgba(240, 214, 168, 0.95) 50%, rgba(232, 205, 160, 0) 62%);
        background-size: 300% 100%;
        background-position: 100% 0;
        -webkit-mask-image: url("assets/brand/amani-wordmark.png");
        mask-image: url("assets/brand/amani-wordmark.png");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
      }
      .skin-row {
        display: flex;
        align-items: center;
        gap: 34px;
        margin-top: 30px;
      }
      .skin-row .line:first-child {
        transform-origin: 100% 50%;
      }
      .skin-row .line:last-child {
        transform-origin: 0% 50%;
      }
      .skin-row .line {
        display: block;
        width: 150px;
        height: 2px;
        background: var(--ink);
      }
      .skin {
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 40px;
        letter-spacing: 0.5em;
        margin-right: -0.5em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .brand-dot {
        display: block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--ink);
        margin: 26px auto 22px;
      }
      .values {
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 24px;
        letter-spacing: 0.42em;
        margin-right: -0.42em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }
      .svc-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px 26px;
        margin-top: 30px;
        max-width: 860px;
      }
      .svc {
        display: block;
        font-family: "Marcellus", serif;
        font-size: 42px;
        line-height: 1.15;
        color: var(--ink);
      }
      .svc-sep {
        display: block;
        width: 10px;
        height: 10px;
        border: 1.5px solid var(--gold);
        transform: rotate(45deg);
      }
      .svc-note {
        display: block;
        margin-top: 8px;
        font-family: "Jost", sans-serif;
        font-weight: 300;
        font-size: 30px;
        letter-spacing: 0.02em;
        color: var(--ink-soft);
      }
      .card {
        display: block;
        width: 880px;
        padding: 26px 40px 28px;
        border-radius: 34px;
        background: rgba(252, 248, 243, 0.88);
        border: 1.5px solid rgba(207, 169, 119, 0.6);
        box-shadow: 0 24px 60px rgba(110, 80, 56, 0.16);
        text-align: center;
      }
      .card-name {
        display: block;
        font-family: "Marcellus", serif;
        font-size: 46px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .card-desc {
        display: block;
        margin-top: 8px;
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 30px;
        line-height: 1.3;
        color: var(--ink-soft);
      }
      .top-ornament {
        margin-bottom: 30px;
      }
      .services {
        font-family: "Jost", sans-serif;
        font-weight: 400;
        font-size: 40px;
        letter-spacing: 0.04em;
        color: var(--ink);
      }
      .services .dot {
        color: #7d5c36;
        padding: 0 0.4em;
      }
      .pill svg {
        width: 34px;
        height: 34px;
        display: block;
      }
      .contacts {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px 16px;
        margin-top: 34px;
        max-width: 860px;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "Jost", sans-serif;
        font-weight: 500;
        font-size: 32px;
        letter-spacing: 0.06em;
        color: var(--ink-soft);
        padding: 12px 24px;
        border: 1.5px solid rgba(163, 123, 76, 0.7);
        border-radius: 999px;
        background: rgba(255, 251, 246, 0.82);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
    >
      <canvas id="iso" width="1080" height="1920"></canvas>
      <div id="veil-top"></div>
      <div id="veil-bottom"></div>
      <div id="leak" data-layout-allow-overflow></div>
      <div id="vignette"></div>

      <!-- SCENES — one sub-composition per beat of the script -->
      <div id="scene-1" data-composition-id="s1-intro" data-composition-src="compositions/s1-intro.html" data-start="0" data-duration="4.6" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="scene-2" data-composition-id="s2-regard" data-composition-src="compositions/s2-regard.html" data-start="4" data-duration="6.6" data-track-index="2" data-width="1080" data-height="1920"></div>
      <div id="scene-3" data-composition-id="s3-peau" data-composition-src="compositions/s3-peau.html" data-start="10" data-duration="6.6" data-track-index="3" data-width="1080" data-height="1920"></div>
      <div id="scene-4" data-composition-id="s4-experience" data-composition-src="compositions/s4-experience.html" data-start="16" data-duration="7.6" data-track-index="4" data-width="1080" data-height="1920"></div>
      <div id="scene-5" data-composition-id="s5-cta" data-composition-src="compositions/s5-cta.html" data-start="23" data-duration="7" data-track-index="5" data-width="1080" data-height="1920"></div>

      <!-- MUSIC & SOUND DESIGN -->
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="30" data-track-index="10" data-volume="0.78"></audio>
      <audio id="sfx-01" src="assets/audio/sfx-shimmer.wav" data-start="0.15" data-duration="2.8" data-track-index="12" data-volume="0.32"></audio>
      <audio id="sfx-02" src="assets/audio/sfx-chime.wav" data-start="0.95" data-duration="2.2" data-track-index="11" data-volume="0.26"></audio>
      <audio id="sfx-03" src="assets/audio/sfx-tick.wav" data-start="1.75" data-duration="1" data-track-index="13" data-volume="0.24"></audio>
      <audio id="sfx-04" src="assets/audio/sfx-whoosh.wav" data-start="3.75" data-duration="1.3" data-track-index="14" data-volume="0.42"></audio>

      <audio id="sfx-07" src="assets/audio/sfx-tick.wav" data-start="6.55" data-duration="1" data-track-index="13" data-volume="0.22"></audio>

      <audio id="sfx-09" src="assets/audio/sfx-whoosh.wav" data-start="9.75" data-duration="1.3" data-track-index="14" data-volume="0.42"></audio>
      <audio id="sfx-10" src="assets/audio/sfx-chime.wav" data-start="10.9" data-duration="2.2" data-track-index="11" data-volume="0.26"></audio>
      <audio id="sfx-11" src="assets/audio/sfx-shimmer.wav" data-start="11.5" data-duration="2.8" data-track-index="12" data-volume="0.2"></audio>
      <audio id="sfx-12" src="assets/audio/sfx-tick.wav" data-start="12.7" data-duration="1" data-track-index="13" data-volume="0.22"></audio>
      <audio id="sfx-13" src="assets/audio/sfx-tick.wav" data-start="13.5" data-duration="1" data-track-index="16" data-volume="0.2"></audio>
      <audio id="sfx-14" src="assets/audio/sfx-droplet.wav" data-start="13.95" data-duration="0.6" data-track-index="15" data-volume="0.4"></audio>

    </div>

    <!-- ===================== ROOT TIMELINE: veils & light leaks ===================== -->
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        // warm light leak that sweeps across every scene change
        const leak = (at, fromX, toX, y) =>
          tl
            .fromTo("#leak", { x: fromX, y: y, opacity: 0 }, { x: (fromX + toX) / 2, opacity: 0.75, duration: 0.55, ease: "sine.in" }, at)
            .to("#leak", { x: toX, opacity: 0, duration: 0.85, ease: "sine.out" }, at + 0.55);
        // ivory veils keep the titles on a calm ground when the 3D fills the frame
        tl.fromTo("#veil-top", { opacity: 0 }, { opacity: 0.55, duration: 1.2, ease: "sine.out" }, 0.2);
        tl.to("#veil-top", { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 4.0);
        tl.to("#veil-top", { opacity: 0.5, duration: 1.4, ease: "sine.inOut" }, 16.2);
        tl.to("#veil-top", { opacity: 0.35, duration: 1.2, ease: "sine.inOut" }, 23.2);
        tl.fromTo("#veil-bottom", { opacity: 0 }, { opacity: 0.85, duration: 1.4, ease: "sine.inOut" }, 4.2);
        tl.to("#veil-bottom", { opacity: 0, duration: 1.2, ease: "sine.inOut" }, 9.9);
        tl.to("#veil-bottom", { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 23.4);
        leak(3.85, -900, 600, 300);
        leak(9.85, 1100, -500, 700);
        leak(15.85, -900, 700, 500);
        leak(22.85, 1000, -600, 200);
        window.__timelines["main"] = tl;
      })();
    </script>

    <!-- ===================== 3D ISOMETRIC WORLD (Three.js) ===================== -->
    <script type="module" src="assets/world.js"></script>
