<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Scène 2 — Soins du regard (4–10,6 s). Loupe : cils & sourcils dessinés poil par poil ; prestations lash lift & brow lift. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        #s2-loupe {
          position: absolute;
          left: 560px;
          top: 1080px;
          width: 460px;
          height: 460px;
          border-radius: 50%;
          filter: drop-shadow(0 26px 40px rgba(110, 78, 58, 0.28));
        }
        #s2-loupe svg {
          width: 100%;
          height: 100%;
          display: block;
        }
        #s2-link {
          position: absolute;
          left: 0;
          top: 0;
          width: 1080px;
          height: 1920px;
        }
      </style>
      <div id="root" data-composition-id="s2-regard" data-width="1080" data-height="1920">
        <svg id="s2-link" viewBox="0 0 1080 1920">
          <path id="s2-link-path" d="M 449 1006 C 500 1070 560 1120 619 1156" fill="none" stroke="#a37b4c" stroke-width="2" stroke-linecap="round" />
          <circle id="s2-link-dot" cx="438" cy="994" r="16" fill="none" stroke="#a37b4c" stroke-width="2.5" />
        </svg>
        <div class="stack">
          <span class="diamond top-ornament" id="s2-orn"></span>
          <div class="title mask" data-layout-allow-overflow><span id="s2-title">Soins du regard</span></div>
          <span class="rule" id="s2-rule"></span>
          <div class="sub mask" data-layout-allow-overflow><span id="s2-sub">Sublimez vos cils &amp; vos sourcils</span></div>
          <!-- prestations -->
          <div class="svc-row">
            <span class="svc" id="s2-svc1">Lash lift coréen</span>
            <span class="svc-sep" id="s2-sep"></span>
            <span class="svc" id="s2-svc2">Brow lift</span>
          </div>
          <span class="svc-note" id="s2-note">Lash lift avec ou sans teinture</span>
        </div>
        <div id="s2-loupe">
          <svg viewBox="0 0 400 400">
            <defs>
              <clipPath id="s2-loupe-clip"><circle cx="200" cy="200" r="190" /></clipPath>
              <radialGradient id="s2-skin" cx="50%" cy="45%" r="70%">
                <stop offset="0%" stop-color="#f6e0d2" />
                <stop offset="70%" stop-color="#ecc9b5" />
                <stop offset="100%" stop-color="#deb39c" />
              </radialGradient>
              <radialGradient id="s2-iris" cx="45%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#b98353" />
                <stop offset="55%" stop-color="#7a4b2f" />
                <stop offset="100%" stop-color="#3a2216" />
              </radialGradient>
              <linearGradient id="s2-goldring" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#e8cf9c" />
                <stop offset="45%" stop-color="#a37b4c" />
                <stop offset="75%" stop-color="#f0dcb0" />
                <stop offset="100%" stop-color="#a57d48" />
              </linearGradient>
              <linearGradient id="s2-lidshade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#d9a996" stop-opacity="0" />
                <stop offset="100%" stop-color="#c98f7f" stop-opacity="0.55" />
              </linearGradient>
              <clipPath id="s2-eye-clip"><path d="M 92 222 Q 200 132 312 210 Q 205 274 92 222 Z" /></clipPath>
            </defs>
            <g clip-path="url(#s2-loupe-clip)">
              <rect width="400" height="400" fill="url(#s2-skin)" />
              <path d="M 80 220 Q 200 104 324 206 Q 205 168 80 220 Z" fill="url(#s2-lidshade)" />
              <path d="M 98 196 Q 205 118 318 186" fill="none" stroke="#c4917f" stroke-width="3" stroke-linecap="round" opacity="0.55" />
              <path id="s2-brow-base" d="M 96 146 Q 170 92 246 96 Q 286 100 314 128 Q 284 112 246 112 Q 172 112 102 158 Z" fill="#6b4733" opacity="0" />
              <g id="s2-brow-hairs"></g>
              <path d="M 92 222 Q 200 132 312 210 Q 205 274 92 222 Z" fill="#fbf4ef" />
              <g clip-path="url(#s2-eye-clip)">
                <circle cx="204" cy="204" r="46" fill="url(#s2-iris)" />
                <circle cx="204" cy="204" r="18" fill="#1d120c" />
                <circle cx="190" cy="190" r="9" fill="#ffffff" opacity="0.92" />
                <circle cx="218" cy="214" r="4" fill="#ffffff" opacity="0.6" />
                <path d="M 92 222 Q 200 132 312 210 L 312 180 L 92 180 Z" fill="#000" opacity="0.08" />
              </g>
              <path d="M 92 222 Q 200 132 312 210" fill="none" stroke="#2c1b15" stroke-width="5" stroke-linecap="round" />
              <path d="M 96 224 Q 205 272 308 212" fill="none" stroke="#9c6b5a" stroke-width="2" stroke-linecap="round" opacity="0.6" />
              <g id="s2-lower-lashes"></g>
              <g id="s2-lashes"></g>
              <g id="s2-sparkles"></g>
            </g>
            <circle cx="200" cy="200" r="191" fill="none" stroke="url(#s2-goldring)" stroke-width="8" />
            <circle cx="200" cy="200" r="181" fill="none" stroke="#fff6ea" stroke-width="1.5" opacity="0.8" />
          </svg>
        </div>
      </div>
      <script>
        (function () {
          const NS = "http://www.w3.org/2000/svg";
          const q = (p0, p1, p2, u) => {
            const a = 1 - u;
            return [a * a * p0[0] + 2 * a * u * p1[0] + u * u * p2[0], a * a * p0[1] + 2 * a * u * p1[1] + u * u * p2[1]];
          };
          const qd = (p0, p1, p2, u) => [2 * (1 - u) * (p1[0] - p0[0]) + 2 * u * (p2[0] - p1[0]), 2 * (1 - u) * (p1[1] - p0[1]) + 2 * u * (p2[1] - p1[1])];
          const path = (parent, d, attrs) => {
            const p = document.createElementNS(NS, "path");
            p.setAttribute("d", d);
            for (const k in attrs) p.setAttribute(k, attrs[k]);
            parent.appendChild(p);
            return p;
          };
          const f1 = (n) => n.toFixed(1);

          // upper lashes along the lid curve, fanning toward the outer corner
          const L0 = [92, 222], L1 = [200, 132], L2 = [312, 210];
          const lashG = document.getElementById("s2-lashes");
          const lashes = [];
          const N = 38;
          for (let i = 0; i < N; i++) {
            const u = 0.04 + (0.94 * i) / (N - 1);
            const b = q(L0, L1, L2, u);
            const d = qd(L0, L1, L2, u);
            const len = Math.hypot(d[0], d[1]);
            const nx = d[1] / len, ny = -d[0] / len;
            const tilt = (u - 0.35) * 0.9;
            const dx = nx * Math.cos(tilt) - ny * Math.sin(tilt), dy = nx * Math.sin(tilt) + ny * Math.cos(tilt);
            const L = 30 + 46 * Math.pow(u, 1.4) + (i % 2 ? -5 : 0);
            const ex = b[0] + dx * L + 10 * u, ey = b[1] + dy * L;
            const mx = b[0] + dx * L * 0.55 + 14 * (0.3 + u), my = b[1] + dy * L * 0.55 - 2;
            lashes.push(path(lashG, `M ${f1(b[0])} ${f1(b[1])} Q ${f1(mx)} ${f1(my)} ${f1(ex)} ${f1(ey)}`, { fill: "none", stroke: "#24160f", "stroke-width": (2.6 - u * 0.6).toFixed(2), "stroke-linecap": "round" }));
          }
          // delicate lower lashes
          const lowG = document.getElementById("s2-lower-lashes");
          const B0 = [96, 224], B1 = [205, 272], B2 = [308, 212];
          for (let i = 0; i < 14; i++) {
            const u = 0.25 + (0.7 * i) / 13;
            const b = q(B0, B1, B2, u);
            const d = qd(B0, B1, B2, u);
            const len = Math.hypot(d[0], d[1]);
            const L = 8 + 8 * u;
            path(lowG, `M ${f1(b[0])} ${f1(b[1])} l ${f1((-d[1] / len) * L + 3)} ${f1((d[0] / len) * L)}`, { stroke: "#3b261c", "stroke-width": "1.4", "stroke-linecap": "round", opacity: "0.7" });
          }
          // brow hairs in three rows along the arch
          const W0 = [100, 152], W1 = [196, 84], W2 = [312, 128];
          const browG = document.getElementById("s2-brow-hairs");
          const hairs = [];
          const H = 86;
          for (let i = 0; i < H; i++) {
            const u = i / (H - 1);
            const row = (i % 3) - 1;
            const b = q(W0, W1, W2, u);
            const d = qd(W0, W1, W2, u);
            const len = Math.hypot(d[0], d[1]);
            const tx = d[0] / len, ty = d[1] / len;
            const thick = 13 * Math.sin(Math.PI * Math.min(1, u * 1.15 + 0.08)) + 3;
            const ox = b[0] + ty * row * thick * 0.42, oy = b[1] - tx * row * thick * 0.42;
            const up = Math.max(0, 1 - u * 3.2);
            const hx = tx * (1 - up) + 0.2 * up, hy = ty * (1 - up) - up;
            const hl = Math.hypot(hx, hy);
            const l = 15 + 3.5 * Math.sin(i * 1.7);
            hairs.push(path(browG, `M ${f1(ox)} ${f1(oy)} Q ${f1(ox + (hx / hl) * l * 0.5)} ${f1(oy + (hy / hl) * l * 0.5 - 3)} ${f1(ox + (hx / hl) * l)} ${f1(oy + (hy / hl) * l - 3)}`, { fill: "none", stroke: i % 4 === 0 ? "#7a5440" : "#55372a", "stroke-width": (1.8 + (i % 3) * 0.3).toFixed(1), "stroke-linecap": "round" }));
          }
          // four-point sparkles
          const spG = document.getElementById("s2-sparkles");
          const sparks = [[330, 150, 16], [292, 86, 10], [352, 200, 9], [128, 112, 8], [236, 66, 12], [62, 196, 7]].map(([x, y, r], k) => {
            const g = document.createElementNS(NS, "g");
            g.setAttribute("transform", `translate(${x} ${y})`);
            spG.appendChild(g);
            const a = r * 0.22;
            return path(g, `M 0 ${-r} Q ${a} ${-a} ${r} 0 Q ${a} ${a} 0 ${r} Q ${-a} ${a} ${-r} 0 Q ${-a} ${-a} 0 ${-r} Z`, { fill: k % 2 ? "#fff8ec" : "#e2c48c" });
          });

          // ---- timeline (scene-local seconds; the scene starts at 4 s)
          const tl = gsap.timeline({ paused: true });
          const soft = (sel, at, dur) => tl.fromTo(sel, { opacity: 0, y: 26, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: dur, ease: "power2.out" }, at);
          tl.fromTo("#s2-orn", { opacity: 0, scale: 0, rotation: 45 }, { opacity: 1, scale: 1, rotation: 45, duration: 0.7, ease: "back.out(2)" }, 0.6);
          tl.fromTo("#s2-title", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.1, ease: "expo.out" }, 0.8);
          tl.fromTo("#s2-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 1.3);
          tl.fromTo("#s2-loupe", { opacity: 0, scale: 0.82, filter: "blur(12px) drop-shadow(0 26px 40px rgba(110,78,58,0.28))" },
            { opacity: 1, scale: 1, filter: "blur(0px) drop-shadow(0 26px 40px rgba(110,78,58,0.28))", duration: 1.2, ease: "power3.out" }, 1.35);
          tl.fromTo("#s2-link-dot", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.6, ease: "back.out(2.4)" }, 1.4);
          tl.fromTo("#s2-link-path", { strokeDasharray: 300, strokeDashoffset: 300 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 1.5);
          lashes.forEach((p, i) => {
            const len = p.getTotalLength();
            tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 1.9 + i * 0.032);
          });
          tl.fromTo("#s2-brow-base", { opacity: 0 }, { opacity: 0.32, duration: 1.4, ease: "sine.inOut" }, 2.5);
          hairs.forEach((p, i) => {
            const len = p.getTotalLength();
            tl.fromTo(p, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: "power1.out" }, 2.6 + i * 0.016);
          });
          tl.fromTo("#s2-lashes", { rotation: 0, transformOrigin: "200px 200px" }, { rotation: -2.2, duration: 1.4, ease: "sine.inOut" }, 3.6);
          soft("#s2-sub", 2.55, 1.0);
          tl.fromTo(["#s2-svc1", "#s2-sep", "#s2-svc2"], { opacity: 0, y: 22, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power2.out", stagger: 0.14 }, 3.2);
          tl.fromTo("#s2-note", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 3.6);
          sparks.forEach((s, k) => {
            tl.fromTo(s, { scale: 0, rotation: -40, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.2)" }, 3.9 + k * 0.12);
            tl.to(s, { scale: 0.45, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 4.5 + k * 0.12);
          });
          // handoff toward the skin-care studio
          tl.to(["#s2-orn", "#s2-title", "#s2-rule", "#s2-sub", "#s2-svc1", "#s2-sep", "#s2-svc2", "#s2-note", "#s2-loupe", "#s2-link"], { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.6, ease: "power2.in", stagger: 0.03 }, 5.75);

          window.__timelines["s2-regard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
