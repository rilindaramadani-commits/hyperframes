<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Scène 1 — Intro (0–4 s). Texte : nom de l'institut + « Révélez votre beauté ». -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
      </style>
      <div id="root" data-composition-id="s1-intro" data-width="1080" data-height="1920">
        <div class="stack">
          <div class="medallion" id="s1-medal">
            <svg viewBox="0 0 150 150">
              <circle class="ring" cx="75" cy="75" r="72" fill="none" stroke="#b89058" stroke-width="2" />
              <circle class="ring2" cx="75" cy="75" r="64" fill="rgba(255,251,246,0.7)" stroke="#d8b97f" stroke-width="1" />
            </svg>
            <!-- PLACEHOLDER : remplacez par votre logo -->
            <span class="logo-text" id="s1-logo">[LOGO]</span>
          </div>
          <!-- PLACEHOLDER : nom de l'institut -->
          <div class="name" id="s1-name">[NOM DE L’INSTITUT]</div>
          <div class="tagline">
            <span class="mask" data-layout-allow-overflow><span id="s1-l1">Révélez</span></span>
            <span class="mask" data-layout-allow-overflow><span id="s1-l2">votre beauté</span></span>
          </div>
          <span class="rule" id="s1-rule"></span>
          <span class="diamond" id="s1-diamond"></span>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const soft = (sel, at, dur, from = {}, to = {}) =>
            tl.fromTo(sel, { opacity: 0, y: 26, filter: "blur(10px)", ...from }, { opacity: 1, y: 0, filter: "blur(0px)", duration: dur, ease: "power2.out", ...to }, at);
          const rise = (sel, at, dur) => tl.fromTo(sel, { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: dur, ease: "expo.out" }, at);

          tl.fromTo("#s1-medal .ring", { strokeDasharray: 453, strokeDashoffset: 453 }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 0.35);
          tl.fromTo("#s1-medal .ring2", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" }, 0.6);
          soft("#s1-logo", 0.85, 0.9);
          soft("#s1-name", 1.05, 1.1, { letterSpacing: "0.6em" }, { letterSpacing: "0.3em" });
          rise("#s1-l1", 1.55, 1.1);
          rise("#s1-l2", 1.78, 1.1);
          tl.fromTo("#s1-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 2.35);
          tl.fromTo("#s1-diamond", { opacity: 0, scale: 0, rotation: 45 }, { opacity: 1, scale: 1, rotation: 45, duration: 0.7, ease: "back.out(2)" }, 2.75);
          // handoff: the text dissolves while the camera glides to the lash studio
          tl.to(["#s1-medal", "#s1-name", "#s1-l1", "#s1-l2", "#s1-rule", "#s1-diamond"], { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.6, ease: "power2.in", stagger: 0.04 }, 3.8);

          window.__timelines["s1-intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
