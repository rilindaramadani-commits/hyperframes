<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Scène 1 — Intro (0–4 s). Texte : nom de l'institut + « Révélez votre beauté ». -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
      </style>
      <div id="root" data-composition-id="s1-intro" data-width="1080" data-height="1920">
        <div class="stack">
          <!-- Signature AMANI SKIN (recréation typographique — remplaçable par le fichier logo officiel) -->
          <div class="lockup" id="s1-lockup">
            <div class="wordmark" id="s1-word"><span>A</span><span>M</span><span>A</span><span>N</span><span>I</span></div>
            <div class="skin-row"><span class="line" id="s1-line-l"></span><span class="skin" id="s1-skin">Skin</span><span class="line" id="s1-line-r"></span></div>
            <span class="brand-dot" id="s1-dot"></span>
            <div class="values" id="s1-values">Beauté · Soin · Confiance</div>
          </div>
          <div class="tagline">
            <span class="mask" data-layout-allow-overflow><span id="s1-l1">Révélez</span></span>
            <span class="mask" data-layout-allow-overflow><span id="s1-l2">votre beauté</span></span>
          </div>
          <span class="rule" id="s1-rule"></span>
          <span class="diamond" id="s1-diamond"></span>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const soft = (sel, at, dur, from = {}, to = {}) =>
            tl.fromTo(sel, { opacity: 0, y: 26, filter: "blur(10px)", ...from }, { opacity: 1, y: 0, filter: "blur(0px)", duration: dur, ease: "power2.out", ...to }, at);
          // AMANI SKIN signature
          tl.fromTo("#s1-word > span", { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.1, ease: "power3.out", stagger: 0.09 }, 0.3);
          tl.fromTo(["#s1-line-l", "#s1-line-r"], { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power2.inOut" }, 0.85);
          tl.fromTo("#s1-skin", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 1.0, ease: "power2.out" }, 0.85);
          tl.fromTo("#s1-dot", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, 1.25);
          tl.fromTo("#s1-values", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 1.35);
          const rise = (sel, at, dur) => tl.fromTo(sel, { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: dur, ease: "expo.out" }, at);

          rise("#s1-l1", 1.7, 1.1);
          rise("#s1-l2", 1.93, 1.1);
          tl.fromTo("#s1-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 2.45);
          tl.fromTo("#s1-diamond", { opacity: 0, scale: 0, rotation: 45 }, { opacity: 1, scale: 1, rotation: 45, duration: 0.7, ease: "back.out(2)" }, 2.85);
          // handoff: the text dissolves while the camera glides to the lash studio
          tl.to(["#s1-lockup", "#s1-l1", "#s1-l2", "#s1-rule", "#s1-diamond"], { opacity: 0, y: -24, filter: "blur(8px)", duration: 0.6, ease: "power2.in", stagger: 0.04 }, 3.8);

          window.__timelines["s1-intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
