<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Scène 5 — Call to action (23–30 s). Remplacez les PLACEHOLDERS entre crochets par vos informations. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        #s5-top {
          top: 210px;
        }
        #s5-card {
          position: absolute;
          left: 80px;
          right: 80px;
          top: 1130px;
          height: 520px;
          border-radius: 44px;
          background: rgba(252, 248, 243, 0.8);
          border: 1.5px solid rgba(216, 185, 127, 0.55);
          box-shadow: 0 30px 70px rgba(120, 88, 66, 0.16);
        }
        #s5-cta {
          position: absolute;
          left: 0;
          right: 0;
          top: 1170px;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          padding: 0 110px;
        }
        #s5-cta .display {
          font-size: 90px;
        }
        #s5-cta .rule {
          margin: 30px auto 26px;
        }
      </style>
      <div id="root" data-composition-id="s5-cta" data-width="1080" data-height="1920">
        <div class="stack" id="s5-top">
          <div class="medallion" id="s5-medal">
            <svg viewBox="0 0 150 150">
              <circle class="ring" cx="75" cy="75" r="72" fill="none" stroke="#b89058" stroke-width="2" />
              <circle class="ring2" cx="75" cy="75" r="64" fill="rgba(255,251,246,0.75)" stroke="#d8b97f" stroke-width="1" />
            </svg>
            <!-- PLACEHOLDER : remplacez par votre logo -->
            <span class="logo-text" id="s5-logo">[LOGO]</span>
          </div>
          <!-- PLACEHOLDER : nom de l'institut -->
          <div class="name" id="s5-name">[NOM DE L’INSTITUT]</div>
        </div>
        <div id="s5-card"></div>
        <div id="s5-cta">
          <div class="display">
            <span class="mask" data-layout-allow-overflow><span id="s5-l1">Réservez votre</span></span>
            <span class="mask" data-layout-allow-overflow><span id="s5-l2">rendez-vous</span></span>
          </div>
          <span class="rule" id="s5-rule"></span>
          <div class="services mask" data-layout-allow-overflow>
            <span id="s5-services">Soins du regard<span class="dot">•</span>Soins de la peau</span>
          </div>
          <!-- PLACEHOLDERS : vos coordonnées -->
          <div class="contacts">
            <span class="pill" id="s5-p1">[INSTAGRAM]</span>
            <span class="pill" id="s5-p2">[TÉLÉPHONE]</span>
            <span class="pill" id="s5-p3">[SITE INTERNET]</span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          // scene-local seconds; the scene starts at 23 s
          const tl = gsap.timeline({ paused: true });
          const soft = (sel, at, dur, from = {}, to = {}) =>
            tl.fromTo(sel, { opacity: 0, y: 26, filter: "blur(10px)", ...from }, { opacity: 1, y: 0, filter: "blur(0px)", duration: dur, ease: "power2.out", ...to }, at);
          tl.fromTo("#s5-medal .ring", { strokeDasharray: 453, strokeDashoffset: 453 }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 1.0);
          tl.fromTo("#s5-medal .ring2", { opacity: 0, scale: 0.8, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" }, 1.25);
          soft("#s5-logo", 1.45, 0.9);
          soft("#s5-name", 1.7, 1.1, { letterSpacing: "0.6em" }, { letterSpacing: "0.3em" });
          tl.fromTo("#s5-card", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 1.2, ease: "power3.out" }, 2.0);
          tl.fromTo(["#s5-l1", "#s5-l2"], { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.1, ease: "expo.out", stagger: 0.23 }, 2.35);
          tl.fromTo("#s5-rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 1.0, ease: "power2.inOut" }, 3.15);
          tl.fromTo("#s5-services", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.0, ease: "expo.out" }, 3.4);
          ["#s5-p1", "#s5-p2", "#s5-p3"].forEach((p, k) => soft(p, 3.95 + k * 0.16, 0.9));
          // closing glint on the gold rule
          tl.to("#s5-rule", { filter: "brightness(1.6)", duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.2);
          window.__timelines["s5-cta"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
