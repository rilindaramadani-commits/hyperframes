    <!-- ===================== ROOT TIMELINE: camera-level effects ===================== -->
    <script>
      (function () {
        const CU = window.__CUE;
        const PL = window.__PLAN;
        const tl = gsap.timeline({ paused: true });
        const W = "#world";
        const blurTo = (at, px, dur, ease = "sine.inOut") => tl.to(W, { filter: `blur(${px}px) saturate(1) sepia(0)`, duration: dur, ease }, at);
        // zoom-through dives and exits: a short focus pull hides the cut between miniature and diorama
        [CU.d1In, CU.d2In, CU.d3In].forEach((c) => {
          blurTo(c - 0.22, 7, 0.22, "power2.in");
          blurTo(c, 0, 0.32, "power2.out");
        });
        [CU.d1Out, CU.d2Out, CU.d3Out].forEach((c) => {
          blurTo(c - 0.18, 6, 0.18, "power2.in");
          blurTo(c, 0, 0.28, "power2.out");
        });
        // whip pans (plan 10, plan 12)
        const whips = [[CU.whip10[0], CU.whip10[1]]];
        CU.days.forEach((f) => whips.push([f - 0.22, f], [f + 0.18, f + 0.4]));
        whips.forEach(([a, b]) => {
          const m = (a + b) / 2;
          blurTo(a, 5, m - a, "power1.in");
          blurTo(m, 0, b - m, "power1.out");
        });
        // the expert's snap: flash, then a desaturated rewind with scanlines and a ◀◀ badge
        [CU.rw1, CU.rw2, CU.rw3].forEach(([a, b]) => {
          tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.55, duration: 0.05, ease: "none" }, a - 0.06);
          tl.to("#flash", { opacity: 0, duration: 0.2, ease: "power2.out" }, a - 0.01);
          tl.to(W, { filter: "blur(0.6px) saturate(0.35) sepia(0.35)", duration: 0.08, ease: "none" }, a);
          tl.to(W, { filter: "blur(0px) saturate(1) sepia(0)", duration: 0.2, ease: "power1.out" }, b - 0.05);
          tl.fromTo("#rewind", { opacity: 0 }, { opacity: 1, duration: 0.08, ease: "none" }, a);
          tl.to("#rewind", { opacity: 0, duration: 0.2, ease: "power1.out" }, b - 0.05);
          tl.fromTo("#rw-badge", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.12, ease: "power2.out" }, a);
          tl.to("#rw-badge", { opacity: 0, x: -20, duration: 0.18, ease: "power2.in" }, b - 0.08);
          // tape jitter
          const n = Math.round((b - a) / 0.05);
          for (let k = 0; k < n; k++) tl.set(W, { x: k % 2 ? -5 : 6, y: k % 3 ? 2 : -3 }, a + k * 0.05);
          tl.set(W, { x: 0, y: 0 }, b);
        });
        // a soft bloom of light into the call to action
        tl.fromTo("#bloom", { opacity: 0, scale: 0.85 }, { opacity: 0.85, scale: 1, duration: 0.45, ease: "sine.in" }, PL.p17.start - 0.3);
        tl.to("#bloom", { opacity: 0, duration: 0.8, ease: "sine.out" }, PL.p17.start + 0.15);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
