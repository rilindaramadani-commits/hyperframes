<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Bloc erreur 02 : titre « Oublier le SPF » puis le mot-clé de la correction. -->
  </head>
  <body>
    <template>
      <style>
        #e2-title {
          top: 250px;
        }
        #e2-key {
          top: 270px;
        }
        #e2-key .headline {
          font-size: 96px;
        }
      </style>
      <div id="root" class="layer" data-composition-id="c-err2" data-width="1080" data-height="1920">
        <div class="veil" id="e2-veil"></div>
        <div class="stack" id="e2-title">
          <span class="kicker" id="e2-kick">Erreur</span>
          <div class="numeral"><span class="mask" data-layout-allow-overflow><span id="e2-num">02</span></span></div>
          <span class="hair" id="e2-hair"></span>
          <div class="headline"><span class="mask" data-layout-allow-overflow><span id="e2-name">Oublier le SPF</span></span></div>
        </div>
        <div class="stack" id="e2-key">
          <div class="headline"><span class="mask" data-layout-allow-overflow><span class="ln">Le SPF,</span></span><span class="mask" data-layout-allow-overflow><span class="ln">ce n'est pas <em>une option.</em></span></span></div>
        </div>
      </div>
      <script>
        (function () {
          // block-local seconds
          const tl = gsap.timeline({ paused: true });
          const tIn = 0.3;
          const tOut = 2.4;
          const kIn = 11.82;
          const kOut = 13.22;
          tl.fromTo("#e2-veil", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, tIn - 0.1);
          tl.fromTo("#e2-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, tIn);
          tl.fromTo("#e2-num", { yPercent: 105, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, tIn + 0.08);
          tl.fromTo("#e2-hair", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: "power2.inOut" }, tIn + 0.25);
          tl.fromTo("#e2-name", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.85, ease: "expo.out" }, tIn + 0.3);
          tl.to("#e2-title", { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.45, ease: "power2.in" }, tOut - 0.45);
          tl.to("#e2-veil", { opacity: 0, duration: 0.5, ease: "sine.in" }, tOut - 0.4);
          // the correction's keyword
          tl.fromTo("#e2-veil", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out", immediateRender: false }, kIn - 0.15);
          tl.fromTo("#e2-key .ln", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.85, ease: "expo.out", stagger: 0.14 }, kIn);
          if (document.querySelector("#e2-key .sym")) tl.fromTo("#e2-key .sym", { scale: 0.4, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(2.2)", immediateRender: false }, kIn + 0.25);
          tl.to("#e2-key", { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.45, ease: "power2.in" }, kOut - 0.45);
          tl.to("#e2-veil", { opacity: 0, duration: 0.5, ease: "sine.in" }, kOut - 0.4);
          window.__timelines["c-err2"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
