<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Bloc conclusion (48–59,5 s) : récap 1-2-3, phrase finale en deux temps, appel à l'action + signature AMANI SKIN. -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Plus Jakarta Sans";
          src: url("assets/fonts/plus-jakarta-sans-latin-500-normal.woff2") format("woff2");
          font-weight: 500;
        }
        @font-face {
          font-family: "Plus Jakarta Sans";
          src: url("assets/fonts/plus-jakarta-sans-latin-600-normal.woff2") format("woff2");
          font-weight: 600;
        }
        @font-face {
          font-family: "Cormorant Garamond";
          src: url("assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2");
          font-weight: 600;
        }
        #oc-cards {
          top: 250px;
          gap: 22px;
        }
        .oc-card {
          display: flex;
          align-items: center;
          gap: 26px;
          width: 760px;
          padding: 24px 40px 24px 30px;
          border-radius: 999px;
          background: rgba(251, 248, 243, 0.92);
          border: 1.5px solid rgba(163, 123, 76, 0.45);
          box-shadow: 0 20px 50px rgba(80, 58, 40, 0.14);
          text-align: left;
        }
        .oc-n {
          font-family: "Cormorant Garamond", serif;
          font-weight: 600;
          font-size: 64px;
          line-height: 1;
          color: var(--bronze);
          width: 46px;
          text-align: center;
        }
        .oc-ico {
          width: 58px;
          height: 58px;
          flex: none;
          color: var(--bronze);
        }
        .oc-t {
          font-family: "Plus Jakarta Sans", sans-serif;
          font-weight: 600;
          font-size: 44px;
          letter-spacing: 0.005em;
          color: var(--ink);
        }
        #oc-final {
          top: 255px;
        }
        #oc-final .headline {
          font-size: 82px;
          line-height: 1.06;
        }
        #oc-p2 {
          margin-top: 34px;
        }
        #oc-cta {
          top: 270px;
        }
        #oc-cta .headline {
          font-size: 132px;
        }
        #oc-sign {
          top: 1352px;
        }
        #oc-word {
          display: block;
          width: 300px;
          height: auto;
        }
        #oc-handle {
          margin-top: 18px;
          font-family: "Plus Jakarta Sans", sans-serif;
          font-weight: 500;
          font-size: 30px;
          letter-spacing: 0.08em;
          color: var(--ink-soft);
        }
      </style>
      <div id="root" class="layer" data-composition-id="c-outro" data-width="1080" data-height="1920">
        <div class="veil" id="oc-veil"></div>
        <!-- récap 1-2-3 -->
        <div class="stack" id="oc-cards">
          <div class="oc-card" id="oc-c1">
            <span class="oc-n">1</span>
            <svg class="oc-ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M19 6h10v5h-10z" /><path d="M17 11h14l2 6v22a4 4 0 0 1-4 4H19a4 4 0 0 1-4-4V17z" /><path d="M15 25h18" /></svg>
            <span class="oc-t">Moins d'actifs</span>
          </div>
          <div class="oc-card" id="oc-c2">
            <span class="oc-n">2</span>
            <svg class="oc-ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="24" cy="24" r="8" /><path d="M24 6v5M24 37v5M6 24h5M37 24h5M11.3 11.3l3.5 3.5M33.2 33.2l3.5 3.5M11.3 36.7l3.5-3.5M33.2 14.8l3.5-3.5" /></svg>
            <span class="oc-t">SPF chaque matin</span>
          </div>
          <div class="oc-card" id="oc-c3">
            <span class="oc-n">3</span>
            <svg class="oc-ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M13 6h22M13 42h22" stroke-linecap="round" /><path d="M16 6c0 10 16 12 16 18S16 32 16 42M32 6c0 10-16 12-16 18s16 8 16 18" /></svg>
            <span class="oc-t">De la régularité</span>
          </div>
        </div>
        <!-- la phrase finale, en deux temps -->
        <div class="stack" id="oc-final">
          <div class="headline" id="oc-p1">
            <span class="mask" data-layout-allow-overflow><span class="p1">Une bonne skincare,</span></span>
            <span class="mask" data-layout-allow-overflow><span class="p1">ce n'est pas d'en faire plus.</span></span>
          </div>
          <span class="hair" id="oc-hair"></span>
          <div class="headline" id="oc-p2">
            <span class="mask" data-layout-allow-overflow><span class="p2">C'est de faire</span></span>
            <span class="mask" data-layout-allow-overflow><span class="p2">les bonnes choses,</span></span>
            <span class="mask" data-layout-allow-overflow><span class="p2" id="oc-reg"><em>régulièrement.</em></span></span>
          </div>
        </div>
        <!-- appel à l'action -->
        <div class="stack" id="oc-cta">
          <span class="kicker" id="oc-kick">À garder</span>
          <span class="hair" id="oc-hair2"></span>
          <div class="headline"><span class="mask" data-layout-allow-overflow><span id="oc-save"><em>Enregistre</em></span></span></div>
          <div class="subline"><span class="mask" data-layout-allow-overflow><span id="oc-why">pour vérifier ta routine</span></span></div>
        </div>
        <div class="stack" id="oc-sign">
          <img id="oc-word" src="assets/brand/amani-wordmark.png" alt="AMANI SKIN" />
          <span id="oc-handle">@amani__skin</span>
        </div>
      </div>
      <script>
        (function () {
          // block-local seconds; the block starts at 48 s (plan 15)
          const W = window.__WORDS || [];
          const at = (plan, prefix, fb) => {
            const w = W.find((x) => x.plan === plan && x.w.toLowerCase().startsWith(prefix.toLowerCase()));
            return (w ? w.s : fb) - 48;
          };
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#oc-veil", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, 0.1);
          // recap: each card lands on its word
          [["#oc-c1", at("p15", "Moins", 48.23)], ["#oc-c2", at("p15", "Du", 48.81)], ["#oc-c3", at("p15", "De", 50.12)]].forEach(([sel, t0]) => {
            tl.fromTo(sel, { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, t0 - 0.05);
            tl.fromTo(sel + " .oc-ico", { scale: 0.5, rotation: -20 }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.4)" }, t0 + 0.05);
          });
          // the three cards stack and slide up out of frame
          tl.to("#oc-cards", { y: -160, opacity: 0, filter: "blur(6px)", duration: 0.5, ease: "power2.in" }, 2.95);
          // final phrase, synced to the voice
          const p1 = at("p16", "Une", 51.48);
          const p2 = at("p16", "C'est", 53.95);
          const reg = at("p16", "régulièrement", 55.13);
          tl.fromTo("#oc-final .p1", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.85, ease: "expo.out", stagger: 0.32 }, p1 - 0.05);
          tl.fromTo("#oc-hair", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: "power2.inOut" }, p2 - 0.35);
          tl.to("#oc-p1", { opacity: 0.45, duration: 0.6, ease: "sine.inOut" }, p2 - 0.1);
          tl.fromTo("#oc-final .p2", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.85, ease: "expo.out", stagger: 0.3 }, p2 - 0.05);
          tl.fromTo("#oc-reg", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.9, ease: "expo.out", immediateRender: false }, reg - 0.08);
          tl.to("#oc-final", { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.45, ease: "power2.in" }, 8.05);
          // call to action + discreet signature
          tl.fromTo("#oc-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 8.45);
          tl.fromTo("#oc-hair2", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: "power2.inOut" }, 8.55);
          tl.fromTo("#oc-save", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 8.5);
          tl.fromTo("#oc-why", { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, 8.75);
          tl.fromTo("#oc-sign", { opacity: 0, y: 20, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.9, ease: "power2.out" }, 9.2);
          window.__timelines["c-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
