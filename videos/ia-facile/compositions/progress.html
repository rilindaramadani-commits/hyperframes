<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Barre de progression façon carrousel : un segment par slide, rempli pendant sa scène. -->
  </head>
  <body>
    <template>
      <style>
        #pg-row {
          position: absolute;
          left: 60px;
          right: 60px;
          top: 196px;
          height: 12px;
          display: flex;
          gap: 12px;
        }
        .pg-seg {
          flex: 1;
          height: 12px;
          border-radius: 6px;
          background: rgba(18, 18, 18, 0.2);
          overflow: hidden;
        }
        .pg-fill {
          width: 100%;
          height: 100%;
          background: var(--ink);
        }
      </style>
      <div id="root" data-composition-id="progress" data-width="1080" data-height="1920">
        <div id="pg-row">
          <div class="pg-seg"><div class="pg-fill" id="pg-1"></div></div>
          <div class="pg-seg"><div class="pg-fill" id="pg-2"></div></div>
          <div class="pg-seg"><div class="pg-fill" id="pg-3"></div></div>
          <div class="pg-seg"><div class="pg-fill" id="pg-4"></div></div>
          <div class="pg-seg"><div class="pg-fill" id="pg-5"></div></div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const cuts = [0, 4.5, 12, 19.5, 27.5, 34];
          for (let i = 0; i < 5; i++) {
            tl.fromTo("#pg-" + (i + 1), { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: cuts[i + 1] - cuts[i], ease: "none" }, cuts[i]);
          }
          window.__timelines["progress"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
