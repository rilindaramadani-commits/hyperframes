<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Slide 1 — couverture : « L'IA / FACILE », la bulle de l'IA, l'accroche. -->
  </head>
  <body>
    <template>
      <style>
        #s1-wrap {
          position: absolute;
          inset: 0;
        }
        #s1-ia {
          position: absolute;
          left: 52px;
          top: 270px;
          font-family: var(--font-display);
          font-size: 300px;
          line-height: 0.9;
          letter-spacing: -0.02em;
        }
        #s1-tilt {
          position: absolute;
          left: 44px;
          top: 560px;
          transform: rotate(-4deg);
          transform-origin: left center;
        }
        #s1-facile {
          display: inline-block;
          padding: 4px 34px 18px;
          background: var(--ai);
          color: #fff;
          border: 6px solid var(--ink);
          box-shadow: 16px 16px 0 var(--ink);
          font-family: var(--font-display);
          font-size: 214px;
          line-height: 1;
          letter-spacing: -0.02em;
        }
        #s1-bub {
          top: 905px;
          max-width: 760px;
        }
        #s1-lede {
          top: 1150px;
        }
      </style>
      <div id="root" data-composition-id="s1" data-width="1080" data-height="1920">
        <div id="s1-wrap">
          <div id="s1-ia">L'IA</div>
          <div id="s1-tilt"><div id="s1-facile">FACILE</div></div>
          <div class="bubble ai" id="s1-bub">Promis, c'est plus simple que tu crois.</div>
          <p class="lede" id="s1-lede">
            <span class="w">5</span> <span class="w">étapes</span> <span class="w">pour</span> <span class="w">t'y</span>
            <span class="w">mettre.</span><br /><span class="w">Sans</span> <span class="w">jargon.</span>
            <span class="w">Sans</span> <span class="w">coder.</span>
          </p>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // frame 0 already reads « L'IA FACILE » (thumbnail + hook); the block settles from a slight tilt
          tl.fromTo("#s1-facile", { rotation: 3, scale: 1.04 }, { rotation: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0);
          tl.fromTo(
            "#s1-bub",
            { scale: 0.6, opacity: 0, transformOrigin: "0% 100%" },
            { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.2)" },
            0.5,
          );
          tl.fromTo(
            "#s1-lede .w",
            { opacity: 0, filter: "blur(6px)" },
            { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" },
            1.3,
          );
          // exit: the conversation scrolls up
          tl.to("#s1-wrap", { y: -440, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power3.in" }, 4.1);
          window.__timelines["s1"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
