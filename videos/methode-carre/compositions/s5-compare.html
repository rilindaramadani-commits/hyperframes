<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Scène 5 — 24 à 27 s : comparaison demande vague / demande CARRÉ (écrans 3D) + conclusion. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #s5-root .ttl { font-size: 76px; }
      </style>
      <div id="root" data-composition-id="s5-compare" data-width="1080" data-height="1920">
        <div class="stack" id="s5-root">
          <span class="mask" data-layout-allow-overflow><span class="kicker" id="s5-k">Avant · Après</span></span>
          <div class="ttl">
            <span class="mask" data-layout-allow-overflow><span id="s5-l1">Structure tes prompts.</span></span>
            <span class="mask" data-layout-allow-overflow><span id="s5-l2">Améliore tes <span class="hl">résultats.</span></span></span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s5-k", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "expo.out" }, 0.08);
          tl.fromTo("#s5-l1", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 0.18);
          tl.fromTo("#s5-l2", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 1.25);
          tl.to(["#s5-k", "#s5-l1", "#s5-l2"], { yPercent: -110, duration: 0.3, ease: "power2.in", stagger: 0.05 }, 2.72);
          window.__timelines["s5-compare"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
