<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Scène 6 — 27 à 30 s : fond chocolat, cube doré RILI SUCCESS (3D), logotype, phrase finale. -->
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; pointer-events: none; }
        #s6-lock { position: absolute; left: 0; right: 0; top: 1000px; text-align: center; }
        #s6-word {
          display: inline-block; font-family: "Sora", sans-serif; font-weight: 800; font-size: 104px;
          letter-spacing: 0.08em; margin-right: -0.08em; line-height: 1.05;
        }
        #s6-fill {
          background: linear-gradient(100deg, #b89252 0%, #e7d3a6 22%, #c9a96a 40%, #f4e6c2 50%, #c9a96a 60%, #a8874e 100%);
          background-size: 260% 100%; background-position: 100% 0;
          -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        #s6-rule { display: block; width: 260px; height: 3px; margin: 34px auto 36px; background: #c9a96a; transform-origin: 50% 50%; }
        #s6-line {
          font-family: "Plus Jakarta Sans", sans-serif; font-weight: 600; font-size: 46px; line-height: 1.32;
          color: #f8f5ef; padding: 0 110px;
        }
      </style>
      <div id="root" data-composition-id="s6-signature" data-width="1080" data-height="1920">
        <div id="s6-lock">
          <span class="mask" data-layout-allow-overflow><span id="s6-word"><span id="s6-fill">RILI SUCCESS</span></span></span>
          <span id="s6-rule"></span>
          <div id="s6-line">
            <span class="mask" data-layout-allow-overflow><span id="s6-a">L'IA devient plus simple</span></span>
            <span class="mask" data-layout-allow-overflow><span id="s6-b">quand tu sais l'utiliser.</span></span>
          </div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // wordmark rises as the gold cube lands (cube at ~1.55 s into the scene), then a sheen crosses it
          tl.fromTo("#s6-word", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.85);
          tl.fromTo("#s6-fill", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.2, ease: "sine.inOut" }, 1.45);
          tl.fromTo("#s6-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, 1.3);
          tl.fromTo("#s6-a", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 1.5);
          tl.fromTo("#s6-b", { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 1.62);
          window.__timelines["s6-signature"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
