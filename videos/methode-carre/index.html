      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--black); }

        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Plus Jakarta Sans", sans-serif;
        color: var(--black);
      }
      /* dark stage (style of the client's reference): black ground, gold perspective grid floor, warm glow */
      #ground {
        position: absolute; inset: 0;
        background:
          radial-gradient(70% 34% at 50% 104%, rgba(201,169,106,0.20) 0%, rgba(59,36,24,0.35) 40%, rgba(15,15,15,0) 75%),
          radial-gradient(120% 70% at 50% 30%, #1a1512 0%, #0f0f0f 60%, #090909 100%);
      }
      #grid-floor {
        position: absolute; left: -900px; right: -900px; bottom: -260px; height: 1200px;
        background-image:
          linear-gradient(rgba(201,169,106,0.22) 2px, transparent 2px),
          linear-gradient(90deg, rgba(201,169,106,0.22) 2px, transparent 2px);
        background-size: 150px 150px; background-position: center top;
        transform: perspective(700px) rotateX(64deg); transform-origin: 50% 100%;
        -webkit-mask-image: linear-gradient(0deg, #000 30%, transparent 92%); mask-image: linear-gradient(0deg, #000 30%, transparent 92%);
      }
      #grid-wall {
        position: absolute; inset: 0;
        background-image: linear-gradient(90deg, rgba(248,245,239,0.035) 2px, transparent 2px);
        background-size: 180px 100%; background-position: center;
        -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 60%); mask-image: linear-gradient(180deg, #000 0%, transparent 60%);
      }
      #ground-choco {
        position: absolute; inset: 0; opacity: 0;
        background: radial-gradient(90% 60% at 50% 40%, #4a2e1f 0%, #3b2418 45%, #1e120b 100%);
      }
      #iso { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #veil-top {
        position: absolute; left: 0; right: 0; top: 0; height: 640px; opacity: 0;
        background: linear-gradient(180deg, rgba(12,11,10,0.97) 0%, rgba(12,11,10,0.9) 58%, rgba(12,11,10,0) 100%);
      }
      #veil-bottom {
        position: absolute; left: 0; right: 0; bottom: 0; height: 560px; opacity: 0.55;
        background: linear-gradient(0deg, rgba(10,9,8,0.92) 0%, rgba(12,11,10,0.6) 40%, rgba(12,11,10,0) 100%);
      }
      #grain {
        position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: screen;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.23 0 0 0 0 0.14 0 0 0 0 0.09 0 0 0 1 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      #vignette {
        position: absolute; inset: 0;
        background: radial-gradient(115% 80% at 50% 48%, rgba(0,0,0,0) 58%, rgba(0,0,0,0.5) 100%);
      }
      /* chocolate curtain for the end card (diagonal wipe) */
      #curtain {
        position: absolute; left: -400px; top: -300px; width: 1880px; height: 2520px;
        background: linear-gradient(180deg, #4a2e1f 0%, #3b2418 50%, #24150d 100%);
        transform-origin: 50% 50%;
      }
      #curtain-edge {
        position: absolute; left: 0; top: 0; width: 18px; height: 100%;
        background: linear-gradient(90deg, #c9a96a, #e7d3a6, #c9a96a);
      }

      /* ---------- shared text system (scenes) ---------- */
      .scene-root { position: absolute; inset: 0; pointer-events: none; }
      .stack { position: absolute; left: 60px; right: 60px; top: 224px; text-align: center; }
      .kicker {
        display: block; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 800; font-size: 30px;
        letter-spacing: 0.3em; margin-right: -0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px;

      .mask { display: block; overflow: hidden; padding: 0.04em 0.06em 0.14em; margin: -0.04em -0.06em -0.14em; }

      .ttl {

      .hl { color: var(--gold); }
      .tiles { display: inline-flex; gap: 10px; vertical-align: -0.12em; }

      .sub {

    <!-- ROOT TIMELINE: veils, end-card curtain -->
    <script>
      (function () {
        const tl = gsap.timeline({ paused: true });
        // calm ground under the titles while the 3D fills the frame
        tl.set("#veil-top", { opacity: 0.85 }, 0);
        tl.to("#veil-top", { opacity: 0, duration: 0.5, ease: "sine.inOut" }, 17.0);
        tl.to("#veil-top", { opacity: 0.85, duration: 0.4, ease: "sine.inOut" }, 23.95);
        // end card: chocolate wipe sweeps in, the chocolate ground stays under the logo
        tl.set("#curtain", { rotation: 14, xPercent: -110 }, 0);
        tl.to("#curtain", { xPercent: 0, duration: 0.62, ease: "power3.inOut" }, 27.0);
        tl.set("#ground-choco", { opacity: 1 }, 27.62);
        tl.to("#curtain", { opacity: 0, duration: 0.3, ease: "sine.out" }, 27.66);
        tl.set(["#veil-top", "#veil-bottom", "#grain"], { opacity: 0 }, 27.62);
        tl.set("#vignette", { opacity: 0.6 }, 27.62);
        window.__timelines["main"] = tl;
      })();
    </script>
